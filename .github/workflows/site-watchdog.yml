name: Site Watchdog

# Real-browser site watchdog (docs/operations/site-watchdog-runbook.md).
#   production: NON-DESTRUCTIVE page checks against the live site, hourly (scripts/watchdog-browser.js)
#   journeys:   the stateful browser journeys (signing, bidding, imports...) in the ISOLATED test environment only
#               (jest tests/browser; an in-memory database; never production), every 6 hours
# Results are posted to the production ingest when the WATCHDOG_INGEST_KEY secret is configured; otherwise the run
# still shows red/green here and keeps a results artifact.
on:
  schedule:
    - cron: '7 * * * *'        # production page checks, hourly
    - cron: '37 */6 * * *'     # isolated journeys, every 6 hours
  workflow_dispatch: {}
# Scheduled runs are off until the owner approves monitoring: set the repository variable WATCHDOG_SCHEDULE_ENABLED=true.
# Manual runs (Actions > Site Watchdog > Run workflow) are always available.

permissions:
  contents: read

concurrency:
  group: site-watchdog-${{ github.event.schedule || 'manual' }}
  cancel-in-progress: false

env:
  BASE_URL: https://bid.advantage.bid
  WATCHDOG_INGEST_URL: https://bid.advantage.bid/api/watchdog/ingest

jobs:
  production:
    if: github.event_name == 'workflow_dispatch' || (github.event.schedule == '7 * * * *' && vars.WATCHDOG_SCHEDULE_ENABLED == 'true')
    runs-on: ubuntu-24.04   # ubuntu-latest moved to 26.04, which Playwright 1.59 cannot install browsers on
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Browser checks (read-only)
        env:
          WATCHDOG_INGEST_KEY: ${{ secrets.WATCHDOG_INGEST_KEY }}
        run: node scripts/watchdog-browser.js --out watchdog-production.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: watchdog-production, path: watchdog-production.json, retention-days: 14, if-no-files-found: ignore }

  journeys:
    if: github.event_name == 'workflow_dispatch' || (github.event.schedule == '37 */6 * * *' && vars.WATCHDOG_SCHEDULE_ENABLED == 'true')
    runs-on: ubuntu-24.04   # ubuntu-latest moved to 26.04, which Playwright 1.59 cannot install browsers on
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Isolated browser journeys (test environment only)
        id: journeys
        continue-on-error: true
        env:
          JWT_SECRET: ci-test-only-not-a-secret
          FULLSTACK_TX_WATCH_FILE: ${{ runner.temp }}/long-transactions.log
        # One suite at a time: on the runner, isolated environments started in parallel stall in setup (2026-11-04: 15
        # tests timed out in parallel and all passed when run alone).
        run: npx jest tests/browser --runInBand --forceExit --json --outputFile=jest-journeys.json
      # A suite that failed is run once more, alone, so a slow or stalled test environment on the runner is told apart
      # from a real product failure (the report classifies: passed on retry = flaky; setup failed twice = not tested).
      - name: Retry failed journeys once, one at a time
        if: steps.journeys.outcome == 'failure'
        env:
          JWT_SECRET: ci-test-only-not-a-secret
        run: |
          files=$(node -e "try{const j=require('./jest-journeys.json');console.log(j.testResults.filter(s=>s.status==='failed').map(s=>s.name).join(' '))}catch(e){}")
          if [ -n "$files" ]; then npx jest $files --runInBand --forceExit --json --outputFile=jest-journeys-retry.json || true; fi
      - name: Test-environment diagnostics (transactions held open in the in-memory database)
        if: always()
        run: cat "${{ runner.temp }}/long-transactions.log" 2>/dev/null || echo "no long transactions"
      - name: Report journeys
        if: always()
        env:
          WATCHDOG_INGEST_KEY: ${{ secrets.WATCHDOG_INGEST_KEY }}
        run: node scripts/watchdog-browser.js --report-journeys jest-journeys.json --retry jest-journeys-retry.json --out watchdog-journeys.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: watchdog-journeys, path: 'watchdog-journeys.json', retention-days: 14, if-no-files-found: ignore }
