name: Tests
# The full jest suite on every push to main and every pull request: business rules on real-database harnesses, plus the
# real-browser journeys (tests/browser) on the isolated full-stack environment (in-memory database, never production).
# History (2026-11-04): this job used to run the legacy Playwright specs in e2e/ against localhost:3000 without starting
# a server, so it never passed; and ubuntu-latest moved to 26.04, where Playwright 1.59 cannot install browsers. The e2e/
# specs still run by hand against a running server (npm run test:governance).
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  test:
    timeout-minutes: 45
    runs-on: ubuntu-24.04   # ubuntu-latest moved to 26.04, which Playwright 1.59 cannot install browsers on
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22   # the same setup as the watchdog journeys job, which installs the browser reliably
        cache: npm
    - name: Install dependencies
      run: npm ci
    - name: No credentials in the repository
      run: node scripts/check-secrets.js --all
    # The browser binary comes from Playwright's own download host and is cached between runs. Its system libraries come
    # from the Ubuntu apt mirror, which has had DNS outages on the runners (2026-11-11: "Temporary failure resolving
    # azure.archive.ubuntu.com" failed three runs before any test ran). The ubuntu-24.04 image already ships Chrome and
    # its libraries, so a mirror outage alone must not stop the run: the libraries step retries and then continues. If a
    # library were really missing, the real-browser tests below fail, so every test still gates this job.
    - name: Playwright version
      id: pw
      run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
    - name: Cache the test browser
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-ubuntu-24.04-${{ steps.pw.outputs.version }}-chromium
    - name: Install the test browser
      run: npx playwright install chromium
    - name: Install the test browser's system libraries
      continue-on-error: true
      timeout-minutes: 10
      run: |
        for i in 1 2 3; do
          npx playwright install-deps chromium && exit 0
          echo "apt mirror unavailable (attempt $i); retrying in 20s"; sleep 20
        done
        echo "::warning::Browser system libraries could not be installed from the apt mirror; using the libraries already on the runner image."
        exit 1
    - name: Run the test suite
      shell: bash
      run: |
        set -o pipefail
        # Business-rule suites in parallel; the real-browser journeys one at a time (isolated environments started in
        # parallel stall in setup on the runner).
        rc=0
        npx jest --testPathPatterns=tests/ --testPathIgnorePatterns=tests/browser/ --forceExit --maxWorkers=2 2>&1 | tee jest-output.txt || rc=1
        npx jest tests/browser --runInBand --forceExit 2>&1 | tee -a jest-output.txt || rc=1
        exit $rc
    - name: No credentials in the test output
      if: always()
      run: node scripts/check-secrets.js --file jest-output.txt
