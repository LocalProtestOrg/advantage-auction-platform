<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Advantage Marketplace Feed</title>
  <style>
    html, body { margin: 0; background: #f8fafc; }
    @media (prefers-color-scheme: dark) { html, body { background: #f8fafc; } }
  </style>
</head>
<body>
  <!--
    Embeddable unified marketplace List View (auctions + estate sales), powered by Railway.
    Brilliant Directories embeds this on /all-events, e.g.:
      <iframe src="https://bid.advantage.bid/widgets/marketplace-feed.html"
              style="width:100%;height:1200px;border:0" loading="lazy"></iframe>
    Filters (?q=&city=&state=&zip=&type=) pass straight through to the feed and to the Map handoff,
    so switching List⇄Map preserves the customer's context.

    CITY-PAGE CONTEXT (for BD city / location pages): pass the page's location so nearby events show on
    first load without the visitor retyping it. The widget accepts EITHER:
      ?city=<City>&state=<State>       — geocoded honestly server-side (recommended for city pages)
      ?lat=<lat>&lng=<lng>&label=<txt> — explicit coordinates (no geocode round-trip)
    plus an optional ?radius=<miles|nationwide> (default 50). Precedence: URL location →
    stored visitor preference → nationwide. A visitor-typed location overrides for the session.
    Examples:
      .../marketplace-feed.html?preset=all-events&city=Houston&state=Texas
      .../marketplace-feed.html?preset=all-events&city=Houston&state=Texas&radius=50
  -->
  <!-- Preset comes from ?preset=all-events|auctions|estate-sales (the widget reads it); the SERVER
       enforces the event type regardless of any client tampering. -->
  <div id="advantage-marketplace-feed"></div>
  <script>
    // Reflect ?preset from the iframe URL onto the mount element (belt-and-suspenders; the widget also
    // reads the URL directly). Only the three known presets are honored.
    (function () { try {
      var p = (new URLSearchParams(location.search).get('preset') || '').toLowerCase();
      if (['all-events', 'auctions', 'estate-sales'].indexOf(p) !== -1)
        document.getElementById('advantage-marketplace-feed').setAttribute('data-preset', p);
    } catch (e) {} })();
  </script>
  <script src="/widgets/marketplace-feed.js"></script>
</body>
</html>
