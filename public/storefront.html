<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Professional Seller · Advantage.Bid</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- SSR-META --><!-- SSR-JSONLD -->
  <style>
    :root{--accent:#2563eb;--ink:#0f172a;--muted:#64748b;--line:#e6eaef;--bg:#f6f8fb}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:var(--ink);background:var(--bg);line-height:1.5}
    img{max-width:100%;display:block}
    a{color:var(--accent);text-decoration:none}
    .wrap{max-width:1120px;margin:0 auto;padding:0 18px}
    h1,h2,h3{font-family:Fraunces,Georgia,serif;line-height:1.15}
    .btn{display:inline-flex;align-items:center;gap:7px;border:none;border-radius:10px;padding:11px 18px;font-weight:700;font-size:14.5px;cursor:pointer;font-family:inherit;text-decoration:none}
    .btn-primary{background:var(--accent);color:#fff}
    .btn-ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
    .btn-dark{background:var(--ink);color:#fff}
    .btn:focus-visible{outline:2px solid #fbbf24;outline-offset:2px}
    /* Hero */
    .hero{position:relative;background:#0f172a;color:#fff;overflow:hidden}
    .hero-cover{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.35}
    .hero-inner{position:relative;max-width:1120px;margin:0 auto;padding:38px 18px 30px;display:flex;gap:22px;align-items:flex-end;flex-wrap:wrap}
    .hero-logo{width:96px;height:96px;border-radius:16px;background:#fff center/cover no-repeat;border:3px solid rgba(255,255,255,.85);flex:none;display:flex;align-items:center;justify-content:center;font-family:Fraunces;font-weight:700;font-size:34px;color:var(--accent)}
    .hero-main{flex:1;min-width:260px}
    .hero-badges{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
    .badge{font-size:11.5px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;border-radius:999px;padding:3px 10px}
    .badge-pro{background:#fbbf24;color:#3a2a00}.badge-loc{background:rgba(255,255,255,.16);color:#fff}
    .hero h1{font-size:clamp(26px,4vw,40px);font-weight:700}
    .hero .tagline{color:#cbd5e1;font-size:16px;margin-top:6px;max-width:640px}
    .hero-cta{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}
    .hero-follow{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.28)}
    /* Sections */
    section{padding:34px 0}
    .sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
    .sec-head h2{font-size:24px;font-weight:700}
    .sec-sub{color:var(--muted);font-size:14px}
    .card{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
    .grid{display:grid;gap:16px}
    .grid-3{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
    .grid-4{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
    .prod .ph,.prod img{aspect-ratio:4/3;width:100%;object-fit:cover;background:#eef2f7 center/cover no-repeat}
    .prod .body{padding:12px 13px}
    .prod .t{font-weight:600;font-size:14.5px;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .prod .price{font-family:Fraunces;font-weight:700;font-size:19px;margin-top:4px}
    .prod .meta{color:var(--muted);font-size:12.5px;margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}
    .pill{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;background:#eef2ff;color:#3730a3}
    .chips{display:flex;gap:8px;flex-wrap:wrap}
    .chip{background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:13.5px;font-weight:600;color:#334155}
    .about{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;font-size:15px;color:#334155;white-space:pre-line}
    .facts{display:flex;gap:22px;flex-wrap:wrap;margin-top:14px}
    .fact b{display:block;font-family:Fraunces;font-size:22px;color:var(--ink)}
    .fact span{color:var(--muted);font-size:12.5px}
    .tst{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px}
    .tst .q{font-size:15px;color:#1e293b;font-style:italic}
    .tst .by{color:var(--muted);font-size:13px;margin-top:9px;font-weight:600}
    .gal{columns:4 200px;column-gap:12px}.gal img{border-radius:10px;margin-bottom:12px;break-inside:avoid}
    .follow-cta{background:linear-gradient(135deg,#1e293b,#0f172a);color:#fff;border-radius:16px;padding:26px;text-align:center}
    .follow-cta h2{color:#fff;font-size:24px}.follow-cta p{color:#cbd5e1;margin:8px auto 16px;max-width:520px}
    .contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
    @media(max-width:760px){.contact-grid{grid-template-columns:1fr}}
    form label{display:block;font-size:12.5px;font-weight:700;color:#475569;margin:10px 0 4px;text-transform:uppercase;letter-spacing:.02em}
    form input,form select,form textarea{width:100%;padding:10px 12px;border:1px solid #cbd5e1;border-radius:9px;font-size:14.5px;font-family:inherit}
    .footer{background:#0f172a;color:#cbd5e1;padding:30px 0;margin-top:20px}
    .footer a{color:#93c5fd}
    .powered{font-size:12.5px;color:#94a3b8;margin-top:14px}
    .muted{color:var(--muted)}.center{text-align:center}
    .empty{color:var(--muted);font-size:14px;background:#fff;border:1px dashed var(--line);border-radius:12px;padding:20px;text-align:center}
    .demo-ribbon{background:#fef3c7;color:#92400e;text-align:center;font-size:13px;font-weight:700;padding:7px}
    .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:11px 18px;border-radius:10px;font-size:14px;display:none;z-index:50}
  </style>
</head>
<body>
  <div id="demo-ribbon"></div>
  <div id="app" aria-live="polite">
    <div class="wrap" style="padding:60px 18px;text-align:center;color:#64748b" id="loading">Loading storefront…</div>
  </div>
  <div id="toast" class="toast"></div>

  <script>
    var SLUG = (location.pathname.match(/\/pro\/([^\/?#]+)/) || [])[1] || new URLSearchParams(location.search).get('slug') || '';
    var token = null; try { token = localStorage.getItem('token'); } catch (e) {}
    function esc(s){return (s==null?'':String(s)).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
    function money(c){return '$'+((c||0)/100).toLocaleString(undefined,{minimumFractionDigits:0});}
    function fmtDate(v){try{var dt=new Date(v);if(isNaN(dt))return '';return dt.toLocaleDateString(undefined,{month:'short',day:'numeric'});}catch(e){return '';}}
    function toast(m){var t=document.getElementById('toast');t.textContent=m;t.style.display='block';setTimeout(function(){t.style.display='none';},2600);}
    function ping(type,extra){try{navigator.sendBeacon&&navigator.sendBeacon('/api/analytics/events',new Blob([JSON.stringify(Object.assign({type:type,seller_id:(DATA&&DATA.seller&&DATA.seller.id)||null},extra||{}))],{type:'application/json'}));}catch(e){}}
    var DATA=null;

    fetch('/api/public/storefront/'+encodeURIComponent(SLUG)).then(function(r){return r.json();}).then(function(res){
      if(!res.success){document.getElementById('app').innerHTML='<div class="wrap" style="padding:80px 18px;text-align:center"><h1 style="font-size:28px">Storefront not found</h1><p class="muted" style="margin-top:10px">This company page is not available.</p><p style="margin-top:18px"><a class="btn btn-primary" href="/">Explore Advantage.Bid</a></p></div>';return;}
      DATA=res.data;render(DATA);ping('storefront_view',{});
    }).catch(function(){document.getElementById('app').textContent='Unable to load storefront.';});

    function accent(cfg){if(cfg.accent){document.documentElement.style.setProperty('--accent',cfg.accent);}}

    function render(d){
      var s=d.seller,cfg=d.config||{},vis=cfg.section_visibility||{},c=d.contact||{};
      accent(cfg);
      document.title=s.name+' | Advantage.Bid';
      if(s.is_demo)document.getElementById('demo-ribbon').innerHTML='<div class="demo-ribbon">DEMO STOREFRONT — sample content for demonstration</div>';
      var logo=s.logo_url?('<div class="hero-logo" style="background-image:url('+esc(s.logo_url)+')"></div>'):('<div class="hero-logo">'+esc((s.name||'?').slice(0,1))+'</div>');
      var badges='<div class="hero-badges">'+(s.is_professional?'<span class="badge badge-pro">Professional Seller</span>':'')+(s.location_label?'<span class="badge badge-loc">'+esc(s.location_label)+'</span>':'')+'</div>';
      var cover=cfg.hero_image?('<div class="hero-cover" style="background-image:url('+esc(cfg.hero_image)+')"></div>'):'';
      var cta='<div class="hero-cta">'+
        (d.auctions.length?'<a class="btn btn-primary" href="#auctions">View Auctions</a>':'')+
        ((d.events&&d.events.length&&vis.events!==false)?'<a class="btn btn-ghost" href="#events">Estate Sales</a>':'')+
        (d.marketplace.length?'<a class="btn btn-ghost" href="#shop">Shop Marketplace</a>':'')+
        '<button class="btn hero-follow" id="followBtn">☆ Follow ('+d.follower_count+')</button>'+
        (vis.contact!==false?'<a class="btn hero-ghost btn-ghost" href="#contact">Request a Consultation</a>':'')+'</div>';
      var hero='<div class="hero">'+cover+'<div class="hero-inner">'+logo+'<div class="hero-main">'+badges+'<h1>'+esc(s.name)+'</h1>'+(cfg.tagline?'<p class="tagline">'+esc(cfg.tagline)+'</p>':'')+cta+'</div></div></div>';

      var html=hero+'<div class="wrap">';

      // About
      if(vis.about!==false && (cfg.about||cfg.years_in_business||(cfg.about_facts||[]).length)){
        html+='<section id="about"><div class="sec-head"><h2>About '+esc(s.name)+'</h2></div><div class="about">'+esc(cfg.about||'')+
          ((cfg.about_facts||[]).length||cfg.years_in_business?'<div class="facts">'+(cfg.years_in_business?'<div class="fact"><b>'+esc(cfg.years_in_business)+'</b><span>Years in business</span></div>':'')+(cfg.about_facts||[]).map(function(f){return '<div class="fact"><b>✓</b><span>'+esc(f)+'</span></div>';}).join('')+'</div>':'')+'</div></section>';
      }
      // Services
      if(vis.services!==false && (cfg.services||[]).length){
        html+='<section id="services"><div class="sec-head"><h2>Services</h2></div><div class="chips">'+cfg.services.map(function(x){return '<span class="chip">'+esc(x)+'</span>';}).join('')+'</div></section>';
      }
      // Auctions
      if(vis.auctions!==false && d.auctions.length){
        html+='<section id="auctions"><div class="sec-head"><h2>Current & Upcoming Auctions</h2></div><div class="grid grid-3">'+d.auctions.map(function(a){
          var img=a.image?'<img src="'+esc(a.image)+'" alt="'+esc(a.title)+'">':'<div class="ph"></div>';
          var loc=[a.city,a.state].filter(Boolean).join(', ')||'Online';
          return '<a class="card prod" href="/auction-view.html?auctionId='+esc(a.id)+'" onclick="ping(\'storefront_cta_click\',{cta:\'auction\'})">'+img+'<div class="body"><div class="t">'+esc(a.title)+'</div><div class="meta"><span class="pill">'+esc(a.auction_state==="active"?"Bidding open":"Upcoming")+'</span><span>'+esc(loc)+'</span></div></div></a>';
        }).join('')+'</div></section>';
      }
      // Upcoming estate sales / events (seller's own, via authoritative org link)
      if(vis.events!==false && d.events && d.events.length){
        html+='<section id="events"><div class="sec-head"><h2>Upcoming Estate Sales</h2><div class="sec-sub">In-person sales & events from '+esc(s.name)+'</div></div><div class="grid grid-3">'+d.events.map(function(ev){
          var img=ev.image?'<img src="'+esc(ev.image)+'" alt="'+esc(ev.title)+'">':'<div class="ph"></div>';
          var loc=[ev.city,ev.state].filter(Boolean).join(', ')||(ev.event_format==='online'?'Online':'');
          var when=ev.start_at?fmtDate(ev.start_at):'';
          return '<a class="card prod" href="'+esc(ev.url)+'" onclick="ping(\'storefront_cta_click\',{cta:\'event\'})">'+img+'<div class="body"><div class="t">'+esc(ev.title)+'</div><div class="meta">'+(when?'<span class="pill">'+esc(when)+'</span>':'')+(loc?'<span>'+esc(loc)+'</span>':'')+'</div></div></a>';
        }).join('')+'</div></section>';
      }
      // Marketplace / Shop
      if(vis.marketplace!==false){
        html+='<section id="shop"><div class="sec-head"><div><h2>Shop Available Items</h2><div class="sec-sub">Available now from '+esc(s.name)+'</div></div></div>';
        html+= d.marketplace.length? ('<div class="grid grid-4">'+d.marketplace.map(function(m){
          var img=(m.thumbnail_url||(m.images&&m.images[0]))?'<img src="'+esc(m.thumbnail_url||m.images[0])+'" alt="'+esc(m.title)+'">':'<div class="ph"></div>';
          var loc=[m.city,m.state].filter(Boolean).join(', ');
          return '<a class="card prod" href="/item.html?id='+esc(m.id)+'" onclick="ping(\'storefront_cta_click\',{cta:\'item\'})">'+img+'<div class="body"><div class="t">'+esc(m.title)+'</div><div class="price">'+money(m.price_cents)+'</div><div class="meta">'+(loc?'<span>'+esc(loc)+'</span>':'')+(m.shippable?'<span class="pill">Ships</span>':'')+(m.source_lot_id?'<span class="pill">From auction</span>':'')+'</div></div></a>';
        }).join('')+'</div>') : '<div class="empty">No items listed right now — check back soon.</div>';
        html+='</section>';
      }
      // Past auctions / portfolio
      if(vis.past!==false && d.past_auctions.length){
        html+='<section id="past"><div class="sec-head"><h2>Past Sales</h2><div class="sec-sub">A portfolio of completed sales</div></div><div class="grid grid-4">'+d.past_auctions.map(function(a){
          var img=a.image?'<img src="'+esc(a.image)+'" alt="'+esc(a.title)+'">':'<div class="ph"></div>';
          return '<a class="card prod" href="/auction-view.html?auctionId='+esc(a.id)+'">'+img+'<div class="body"><div class="t">'+esc(a.title)+'</div><div class="meta"><span>'+esc([a.city,a.state].filter(Boolean).join(', '))+'</span></div></div></a>';
        }).join('')+'</div></section>';
      }
      // Gallery
      if(vis.gallery!==false && (cfg.gallery||[]).length){
        html+='<section id="gallery"><div class="sec-head"><h2>Gallery</h2></div><div class="gal">'+cfg.gallery.map(function(u){return '<img src="'+esc(u)+'" alt="'+esc(s.name)+' gallery image" loading="lazy">';}).join('')+'</div></section>';
      }
      // Testimonials
      if(vis.testimonials!==false && (cfg.testimonials||[]).length){
        html+='<section id="testimonials"><div class="sec-head"><h2>What Clients Say</h2>'+(s.is_demo?'<div class="sec-sub">Demo testimonials</div>':'<div class="sec-sub">Company testimonials</div>')+'</div><div class="grid grid-3">'+cfg.testimonials.map(function(t){
          return '<div class="tst"><div class="q">“'+esc(t.text)+'”</div><div class="by">— '+esc(t.name||'Client')+(t.location?', '+esc(t.location):'')+'</div></div>';
        }).join('')+'</div></section>';
      }
      // Follow CTA
      html+='<section><div class="follow-cta"><h2>Never miss a sale</h2><p>Follow '+esc(s.name)+' and Advantage.Bid will notify you when they publish new sales, auctions, and items.</p><button class="btn btn-primary" id="followBtn2">☆ Follow this company</button></div></section>';
      // Contact / consultation
      if(vis.contact!==false){
        html+='<section id="contact"><div class="sec-head"><h2>Need help with an estate?</h2></div><div class="contact-grid"><div class="card" style="padding:20px">'+
          '<h3 style="font-size:18px;margin-bottom:10px">Request a Consultation</h3><form id="inqForm">'+
          '<label>Your name *</label><input id="i-name" required maxlength="120">'+
          '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div><label>Phone</label><input id="i-phone" maxlength="40"></div><div><label>Email</label><input id="i-email" type="email" maxlength="160"></div></div>'+
          '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div><label>City</label><input id="i-city" maxlength="120"></div><div><label>Service needed</label><input id="i-service" maxlength="120" placeholder="Estate sale, appraisal…"></div></div>'+
          '<label>Message</label><textarea id="i-message" rows="4" maxlength="2000"></textarea>'+
          '<p class="muted" style="font-size:12px;margin:8px 0">Provide a phone or email so the company can reach you.</p>'+
          '<button class="btn btn-primary" type="submit" style="margin-top:6px">Send Request</button><div id="inqMsg" class="muted" style="font-size:13px;margin-top:8px"></div></form></div>'+
          '<div class="card" style="padding:20px"><h3 style="font-size:18px;margin-bottom:10px">Contact</h3>'+
          (c.phone?'<p style="margin:6px 0">📞 <a href="tel:'+esc(String(c.phone).replace(/[^0-9+]/g,''))+'">'+esc(c.phone)+'</a></p>':'')+
          (c.email?'<p style="margin:6px 0">✉ <a href="mailto:'+esc(c.email)+'">'+esc(c.email)+'</a></p>':'')+
          (c.website?'<p style="margin:6px 0">🌐 <a href="'+esc(c.website)+'" target="_blank" rel="noopener nofollow">Website</a></p>':'')+
          (c.service_area?'<p style="margin:6px 0">📍 '+esc(c.service_area)+'</p>':'')+
          (c.hours?'<p style="margin:10px 0 0;white-space:pre-line" class="muted">'+esc(c.hours)+'</p>':'')+
          (Object.keys(c.socials||{}).length?'<p style="margin:12px 0 0">'+Object.keys(c.socials).map(function(k){return '<a href="'+esc(c.socials[k])+'" target="_blank" rel="noopener nofollow" style="margin-right:12px;text-transform:capitalize">'+esc(k)+'</a>';}).join('')+'</p>':'')+
          '</div></div></section>';
      }
      html+='</div>'; // wrap
      html+='<div class="footer"><div class="wrap"><div style="font-weight:800;font-size:16px;color:#fff">'+esc(s.name)+'</div>'+(c.service_area?'<div style="margin-top:4px">'+esc(c.service_area)+'</div>':'')+'<div class="powered">Professional Storefront powered by <a href="/">Advantage.Bid</a></div></div></div>';

      document.getElementById('app').innerHTML=html;
      wire();
    }

    function wire(){
      var followers=DATA.follower_count;var following=false;
      function updateFollow(){['followBtn','followBtn2'].forEach(function(id){var b=document.getElementById(id);if(b)b.textContent=(following?'✓ Following ':'☆ Follow ')+(id==='followBtn'?('('+followers+')'):'this company');});}
      function doFollow(){
        if(!token){toast('Sign in to follow');setTimeout(function(){location.href='/login.html?next='+encodeURIComponent(location.pathname);},900);return;}
        var method=following?'DELETE':'POST';
        fetch('/api/sellers/'+DATA.seller.id+'/follow',{method:method,headers:{Authorization:'Bearer '+token}}).then(function(r){
          if(r.ok){following=!following;followers+=following?1:-1;updateFollow();if(following)ping('storefront_cta_click',{cta:'follow'});}
          else toast('Could not update follow');
        }).catch(function(){toast('Network error');});
      }
      ['followBtn','followBtn2'].forEach(function(id){var b=document.getElementById(id);if(b)b.addEventListener('click',doFollow);});
      var f=document.getElementById('inqForm');
      if(f)f.addEventListener('submit',function(e){e.preventDefault();
        var body={name:val('i-name'),phone:val('i-phone'),email:val('i-email'),city:val('i-city'),service:val('i-service'),message:val('i-message')};
        var msg=document.getElementById('inqMsg');msg.textContent='Sending…';
        fetch('/api/public/storefront/'+encodeURIComponent(SLUG)+'/inquiry',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(function(r){return r.json();}).then(function(res){
          if(res.success){msg.style.color='#166534';msg.textContent='✓ '+res.message;f.reset();ping('storefront_cta_click',{cta:'inquiry'});}
          else{msg.style.color='#b91c1c';msg.textContent=res.message||'Could not send.';}
        }).catch(function(){msg.textContent='Network error.';});
      });
      function val(id){return (document.getElementById(id)||{}).value||'';}
    }
  </script>
</body>
</html>
