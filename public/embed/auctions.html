<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Auctions</title>
<style>
  /* White-label: the embedded presentation carries NO Advantage.Bid visual branding. The host company's
     brand stays front-and-center on its own page; this iframe shows only their auctions, catalogs and lots.
     Bidding, sign-in and legal identification happen on the bid.advantage.bid platform, opened in a new tab.
     The script lives in /embed/auctions.js. */
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1f2937;background:transparent}
  .wl-wrap{max-width:1100px;margin:0 auto;padding:8px}
  .wl-co{font-size:1.05rem;font-weight:800;margin:6px 4px 10px;color:#111827}
  .wl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
  .wl-card{border:1px solid #e5e7eb;border-radius:12px;overflow:hidden;background:#fff;display:flex;flex-direction:column}
  .wl-thumb{width:100%;aspect-ratio:16/10;object-fit:cover;background:#f3f4f6;display:block}
  .wl-body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
  .wl-title{font-weight:700;font-size:.95rem;line-height:1.3;color:#111827;margin:0}
  .wl-meta{font-size:.8rem;color:#6b7280}
  .wl-chip{display:inline-block;font-size:.66rem;font-weight:800;letter-spacing:.03em;text-transform:uppercase;border-radius:999px;padding:2px 8px;width:fit-content}
  .wl-live{background:#dcfce7;color:#166534}
  .wl-up{background:#dbeafe;color:#1e40af}
  .wl-cta{margin-top:auto;display:inline-block;text-align:center;text-decoration:none;font-weight:700;font-size:.85rem;padding:.55rem .9rem;border-radius:9px;background:#111827;color:#fff}
  .wl-cta:hover{background:#374151}
  .wl-empty{padding:26px 12px;text-align:center;color:#6b7280;font-size:.9rem}
  .wl-sec{font-size:.72rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#9ca3af;margin:14px 4px 6px}
  /* In-frame catalog and lot views (owner request 2026-11-03): same pattern as the storefront widget. */
  a.wl-card{text-decoration:none;color:inherit}
  a.wl-card:hover,a.wl-card:focus{border-color:#9ca3af;outline:none}
  a.wl-card:focus-visible{outline:2px solid #2563eb;outline-offset:2px}
  .wl-lots{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
  .wl-sq{aspect-ratio:1/1}
  .wl-noimg{display:flex;align-items:center;justify-content:center;color:#9ca3af;font-size:.8rem}
  .wl-bid{font-weight:800;font-size:.9rem;color:#111827}
  .wl-big{font-size:1.15rem;margin:6px 0}
  .wl-link{margin-top:auto;font-weight:700;font-size:.82rem;color:#1d4ed8}
  .wl-back{display:inline-flex;align-items:center;gap:6px;margin:4px 4px 12px;padding:.5rem .85rem;border:1px solid #d1d5db;border-radius:9px;background:#fff;color:#111827;font:inherit;font-weight:700;font-size:.88rem;cursor:pointer;min-height:40px}
  .wl-back:hover{background:#f9fafb}
  .wl-ahead{margin:0 4px 6px}
  .wl-h1{font-size:1.3rem;line-height:1.25;margin:2px 0 6px;color:#111827}
  .wl-desc{white-space:pre-line;font-size:.92rem;line-height:1.55;color:#374151;margin:10px 4px}
  .wl-item{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;margin:0 4px}
  @media (max-width:720px){.wl-item{grid-template-columns:1fr}}
  .wl-item .wl-desc{margin:12px 0}
  .wl-fact{font-size:.88rem;color:#374151;margin:4px 0}
  .wl-buy{border:1px solid #e5e7eb;border-radius:12px;padding:14px;margin:12px 0;background:#fff}
  .wl-btn{display:block;text-align:center;text-decoration:none;font-weight:800;font-size:.95rem;padding:.75rem 1rem;border-radius:10px;background:#111827;color:#fff;min-height:44px}
  .wl-btn:hover{background:#374151}
  .wl-btn-mut{background:#e5e7eb;color:#111827}
  .wl-small{font-size:.78rem;color:#6b7280;margin:8px 4px 0}
  .wl-small a{color:#1d4ed8}
</style>
</head>
<body>
<div class="wl-wrap"><div id="wl-root"><div class="wl-empty">Loading auctions…</div></div></div>
<script src="/widgets/shared/image-gallery.js"></script>
<script src="/embed/auctions.js"></script>
</body>
</html>
