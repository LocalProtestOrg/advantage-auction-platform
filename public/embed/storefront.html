<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>Shop</title>
<style>
  /* Professional Seller website widget (roadmap 7.5). Public inventory only. Shoppers browse the shop AND open an item's
     details inside this frame, so they stay on the seller's website; the item's canonical Advantage.Bid page (indexed)
     is linked from each detail view, and purchasing opens Advantage.Bid's secure checkout in a new tab. Embedded displays
     are noindex. The script lives in /embed/storefront.js. */
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1f2937;background:transparent}
  .sw-wrap{max-width:1100px;margin:0 auto;padding:8px}
  .sw-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin:4px 4px 12px}
  .sw-brand{display:flex;align-items:center;gap:10px;min-width:0}
  .sw-logo{width:44px;height:44px;border-radius:10px;border:1px solid #e5e7eb;background:#fff center/contain no-repeat;background-origin:content-box;padding:4px;flex:none}
  .sw-co{font-size:1.05rem;font-weight:800;color:#111827;margin:0}
  .sw-count{font-size:.8rem;color:#6b7280}
  .sw-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
  .sw-card{border:1px solid #e5e7eb;border-radius:12px;overflow:hidden;background:#fff;display:flex;flex-direction:column;text-decoration:none;color:inherit}
  .sw-card:hover,.sw-card:focus{border-color:#9ca3af;outline:none}
  .sw-card:focus-visible{outline:2px solid #2563eb;outline-offset:2px}
  .sw-img{width:100%;aspect-ratio:1/1;object-fit:cover;background:#f3f4f6;display:block}
  .sw-noimg{width:100%;aspect-ratio:1/1;background:#f3f4f6;display:flex;align-items:center;justify-content:center;color:#9ca3af;font-size:.8rem}
  .sw-body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:5px;flex:1}
  .sw-title{font-weight:700;font-size:.92rem;line-height:1.3;color:#111827;margin:0}
  .sw-price{font-weight:800;font-size:1rem;color:#111827}
  .sw-meta{font-size:.78rem;color:#6b7280;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .sw-pill{display:inline-block;font-size:.68rem;font-weight:700;border-radius:999px;padding:2px 8px;background:#f3f4f6;color:#374151}
  .sw-cta{margin-top:auto;font-size:.82rem;font-weight:700;color:#1d4ed8}
  .sw-empty{padding:26px 12px;text-align:center;color:#6b7280;font-size:.9rem}
  .sw-foot{margin:16px 4px 4px;font-size:.8rem;color:#6b7280;text-align:center}
  .sw-foot a{color:#1d4ed8;font-weight:700;text-decoration:none}
  /* Item view */
  .sw-back{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid #d1d5db;border-radius:8px;padding:8px 12px;font-weight:700;font-size:.9rem;color:#111827;cursor:pointer;margin:2px 4px 12px}
  .sw-back:focus-visible{outline:2px solid #2563eb;outline-offset:2px}
  .sw-item{display:grid;grid-template-columns:1.1fr 1fr;gap:22px;align-items:start;padding:0 4px}
  @media (max-width:700px){.sw-item{grid-template-columns:1fr;gap:14px}}
  .sw-item h1{font-size:1.4rem;line-height:1.25;margin:0 0 6px;color:#111827}
  .sw-item .sw-price{font-size:1.5rem;margin:6px 0 10px}
  .sw-desc{white-space:pre-wrap;font-size:.95rem;line-height:1.55;color:#374151;margin:12px 0}
  .sw-facts{font-size:.88rem;color:#4b5563;margin:4px 0}
  .sw-buy{border:1px solid #e5e7eb;border-radius:12px;padding:14px;margin:12px 0;background:#fff}
  .sw-btn{display:inline-block;background:#1d4ed8;color:#fff;font-weight:800;text-decoration:none;border-radius:9px;padding:11px 18px;font-size:.98rem}
  .sw-btn:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}
  .sw-small{font-size:.8rem;color:#6b7280;margin:8px 0 0}
  .sw-small a{color:#1d4ed8;font-weight:700}
</style>
<script src="/widgets/shared/image-gallery.js"></script>
</head>
<body>
<div class="sw-wrap"><div id="sw-root"><div class="sw-empty">Loading items...</div></div></div>
<script src="/embed/storefront.js"></script>
</body>
</html>
