<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Event - Advantage.Bid</title>
<meta name="description" content="Local event details on Advantage.Bid." />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#0B1B2B; --paper:#FBFAF7; --surface:#fff; --muted:#637488; --hair:#ECE8E0; --accent:#2F6BFF; --live:#B5273B; --ease:cubic-bezier(.22,.7,.2,1); }
  *{box-sizing:border-box} body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
  .serif{font-family:"Fraunces","Georgia",serif}
  header{position:sticky;top:0;z-index:20;background:rgba(251,250,247,.9);backdrop-filter:saturate(150%) blur(12px);border-bottom:1px solid var(--hair)}
  .hin{max-width:920px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:12px 20px}
  .brand{font-family:"Fraunces","Georgia",serif;font-weight:700;font-size:18px;color:var(--ink)}.brand span{color:var(--accent)}
  .sp{flex:1}.hlink{color:var(--muted);font-weight:600;font-size:14px}
  .wrap{max-width:920px;margin:0 auto;padding:20px 20px 60px}
  .crumbs{font-size:13px;color:var(--muted);margin:2px 0 6px}.crumbs a{color:var(--muted);font-weight:600}.crumbs a:hover{color:var(--accent)}.crumbs .sep{opacity:.5;margin:0 6px}.crumbs [aria-current]{color:var(--ink)}
  .hero{margin-top:12px;border-radius:20px;overflow:hidden;aspect-ratio:16/9;max-height:420px;background:#eef0f3 center/cover no-repeat;box-shadow:0 18px 44px rgba(8,16,28,.14)}
  .hero.none{background:linear-gradient(135deg,#243b6b,#7a274a)}
  h1{font-family:"Fraunces","Georgia",serif;font-weight:600;font-size:clamp(26px,4vw,40px);line-height:1.06;letter-spacing:-.01em;margin:18px 0 6px}
  .orgrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:#3a4a5c;font-size:14px;margin-bottom:14px}
  .badge{font-size:11px;font-weight:800;border-radius:999px;padding:3px 9px}
  .badge.community{background:#eef2f6;color:#475569}.badge.verified{background:rgba(22,163,74,.12);color:#15803d}.badge.imported{background:#fef3c7;color:#92610a}.badge.advantage{background:rgba(181,39,59,.1);color:var(--live)}
  .meta{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--hair);border-radius:16px;padding:16px 18px;margin:16px 0}
  .meta .r{display:flex;gap:10px;font-size:14.5px}.meta .r b{color:var(--ink)}.meta .ic{width:20px;flex:0 0 auto;text-align:center}
  .desc{font-size:16px;line-height:1.7;color:#2c3a4b;white-space:pre-wrap;margin:8px 0 20px}
  .gallery{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 22px}
  .gallery img{width:150px;height:110px;object-fit:cover;border-radius:12px;border:1px solid var(--hair)}
  .cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
  .btn{border-radius:12px;padding:12px 22px;font-weight:800;font-size:15px;display:inline-block}
  .btn.primary{background:var(--live);color:#fff;box-shadow:0 8px 20px rgba(181,39,59,.26)}
  .btn.primary:hover{filter:brightness(1.06);text-decoration:none}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--hair)}.btn.ghost:hover{border-color:var(--accent);color:var(--accent);text-decoration:none}
  .leaving{background:var(--surface);border:1px solid var(--hair);border-radius:16px;padding:16px 18px;margin:18px 0}
  .leaving .lead{font-weight:700;font-size:14.5px;margin:0 0 3px}
  .leaving .sub{color:var(--muted);font-size:13px;margin:0 0 12px}
  .leaving .ext{font-weight:600;font-size:11.5px;opacity:.85}
  .cat{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
  .attrib{font-size:12.5px;color:var(--muted);margin-top:18px;border-top:1px solid var(--hair);padding-top:12px}
  .sec{margin:34px 0 0}.sec h2{font-family:"Fraunces","Georgia",serif;font-weight:600;font-size:20px;margin:0 0 12px}
  .grid{display:grid;gap:14px;grid-template-columns:repeat(3,1fr)}
  @media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:480px){.grid{grid-template-columns:1fr}}
  .ec{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--hair);border-radius:14px;overflow:hidden;text-decoration:none;color:inherit}
  .ec:hover{border-color:var(--accent)}.ec .im{width:100%;aspect-ratio:16/10;object-fit:cover;background:#eef0f3;display:block}.ec .imph{width:100%;aspect-ratio:16/10;background:linear-gradient(135deg,#243b6b,#7a274a)}
  .ec .b{padding:11px 13px}.ec .t{font-weight:700;font-size:14px;line-height:1.3;margin:0 0 3px}.ec .m{color:var(--muted);font-size:12.5px}
  .cos{display:flex;gap:10px;flex-wrap:wrap}.co{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--hair);border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px}
  .co img{width:22px;height:22px;border-radius:50%;object-fit:cover}
  .loading,.err{padding:60px 16px;text-align:center;color:var(--muted)}
  @media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><div class="hin"><a class="brand" href="/">Advantage<span>.Bid</span></a><a class="hlink" href="/events.html">Events</a><div class="sp"></div><a class="hlink" href="/">🗺 Map</a></div></header>
<div class="wrap">
  <div id="content"><div class="loading">Loading…</div></div>
</div>
<script>
(function () {
  var content = document.getElementById('content');
  var API = '/api/public/events/';
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  // ALL external links use a new tab + rel="nofollow noopener noreferrer" (owner rule).
  var EXT = ' target="_blank" rel="nofollow noopener noreferrer"';
  function fmtRange(a, b) {
    if (!a) return '';
    try {
      var da = new Date(a), o = { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' };
      var s = da.toLocaleString('en-US', o);
      if (b) { var d2 = new Date(b); s += ' to ' + d2.toLocaleString('en-US', { hour: 'numeric', minute: '2-digit' }); }
      return s;
    } catch (e) { return ''; }
  }
  function shortDate(a) { try { return new Date(a).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }); } catch (e) { return ''; } }
  function badgeClass(b) { b = (b || '').toLowerCase(); return b.indexOf('verified') >= 0 ? 'verified' : b.indexOf('imported') >= 0 ? 'imported' : b.indexOf('advantage') >= 0 ? 'advantage' : 'community'; }
  var slug = new URLSearchParams(location.search).get('slug');
  if (!slug) { content.innerHTML = '<div class="err">No event specified.</div>'; return; }

  function eventCard(it) {
    var loc = [it.city, it.state].filter(Boolean).join(', ');
    var img = it.cover_image_url ? '<img class="im" src="' + esc(it.cover_image_url) + '" alt="' + esc(it.title || '') + '" loading="lazy">' : '<div class="imph"></div>';
    // INTERNAL link only — never routes to an external host.
    return '<a class="ec" href="' + esc(it.url) + '">' + img + '<div class="b"><div class="t">' + esc(it.title || 'Event') + '</div>'
      + '<div class="m">' + [shortDate(it.start_at), loc].filter(Boolean).join(' · ') + '</div></div></a>';
  }
  function section(title, cards) { return cards.length ? '<div class="sec"><h2>' + esc(title) + '</h2><div class="grid">' + cards.map(eventCard).join('') + '</div></div>' : ''; }

  // Breadcrumbs — crawlable INTERNAL links (title optional for the ended/gone states).
  function crumbsHtml(title) {
    return '<nav class="crumbs" aria-label="Breadcrumb"><a href="/">Home</a><span class="sep">›</span>'
      + '<a href="/events.html">Events</a>' + (title ? '<span class="sep">›</span><span aria-current="page">' + esc(title) + '</span>' : '') + '</nav>';
  }

  // Keep exploring Advantage.Bid — related local events, nearby events, and companies
  // with public profiles. Every card links to an INTERNAL /event.html?slug= page.
  function loadRelated() {
    fetch(API + encodeURIComponent(slug) + '/related').then(function (r) { return r.json(); }).then(function (rr) {
      var d = (rr && rr.data) || {}; var host = document.getElementById('related'); if (!host) return;
      var cos = (d.companies || []).length
        ? '<div class="sec"><h2>Companies with events here</h2><div class="cos">' + d.companies.map(function (c) {
            return '<span class="co">' + (c.logo_url ? '<img src="' + esc(c.logo_url) + '" alt="">' : '') + esc(c.name) + '</span>'; }).join('') + '</div></div>' : '';
      host.innerHTML = section('More events in this area', d.related || []) + section('Nearby events', d.nearby || []) + cos;
    }).catch(function () {});
  }

  // An IMPORTED event that has ended: the API returns a deliberately minimal payload
  // (no title/description/images/urls). Keep the visitor on Advantage.Bid with active
  // events; nothing from the external source is shown.
  function renderExpired(d) {
    document.title = 'This sale has ended - Advantage.Bid';
    var place = [d.city, d.state].filter(Boolean).join(', ');
    content.innerHTML = crumbsHtml('Sale ended')
      + '<div class="hero none"></div>'
      + '<h1>This sale has ended</h1>'
      + '<p class="desc">This listing is no longer active' + (place ? ' in ' + esc(place) : '') + '. Explore other events happening near you below.</p>'
      + '<div class="cta"><a class="btn ghost" href="/events.html">Browse all events</a></div>'
      + '<div id="related"></div>';
    loadRelated();
  }

  // The upstream source retracted this listing → the API returns 410 Gone.
  function renderGone() {
    document.title = 'Listing unavailable - Advantage.Bid';
    content.innerHTML = crumbsHtml('Unavailable')
      + '<div class="hero none"></div>'
      + '<h1>This listing is no longer available</h1>'
      + '<p class="desc">The source removed this listing. It’s no longer shown on Advantage.Bid.</p>'
      + '<div class="cta"><a class="btn ghost" href="/events.html">Browse all events</a></div>';
  }

  fetch(API + encodeURIComponent(slug)).then(function (r) {
    if (r.status === 410) { renderGone(); return null; }
    return r.json();
  }).then(function (res) {
    if (res === null) return; // 410 already handled
    if (!res || !res.data) { content.innerHTML = '<div class="err">This event isn’t available.</div>'; return; }
    if (res.data.expired) { renderExpired(res.data); return; }
    var e = res.data, org = e.organization;
    document.title = e.title + ' - Advantage.Bid';
    if (e.description) { var md = document.querySelector('meta[name=description]'); if (md) md.setAttribute('content', String(e.description).slice(0, 155)); }

    var loc = [e.venue_name, e.address, [e.city, e.state].filter(Boolean).join(', '), e.zip].filter(Boolean).join(' · ');
    var mapsQ = e.lat != null && e.lng != null ? (e.lat + ',' + e.lng) : [e.venue_name, e.address, e.city, e.state, e.zip].filter(Boolean).join(' ');
    var gallery = (e.images || []).length > 1
      ? '<div class="gallery">' + e.images.map(function (im) { return '<img src="' + esc(im.url) + '" alt="" loading="lazy">'; }).join('') + '</div>' : '';

    // Breadcrumbs — crawlable INTERNAL links.
    var crumbs = crumbsHtml(e.title);

    // External CTA — clear, intentional, opens a new tab, and says the visitor is leaving Advantage.Bid.
    var extUrl = e.registration_url || e.bidding_url || e.external_url;
    var extLabel = e.bidding_url ? 'Bid on the original website' : 'View the original listing';
    var leaving = extUrl ? '<div class="leaving"><p class="lead">This sale is hosted on an external website.</p>'
      + '<p class="sub">Register, bid, and see full host details on the original site — you’ll leave Advantage.Bid in a new tab.</p>'
      + '<a class="btn primary" href="' + esc(extUrl) + '"' + EXT + '>' + esc(extLabel) + ' ↗ <span class="ext">— leaves Advantage.Bid</span></a></div>' : '';

    content.innerHTML = crumbs
      + '<div class="hero' + (e.cover_image_url ? '' : ' none') + '"' + (e.cover_image_url ? ' style="background-image:url(\'' + esc(e.cover_image_url) + '\')"' : '') + '></div>'
      + (e.category ? '<div class="cat" style="margin-top:16px">' + esc(e.category.replace(/_/g, ' ')) + '</div>' : '')
      + '<h1>' + esc(e.title) + '</h1>'
      + '<div class="orgrow"><span class="badge ' + badgeClass(e.organizer_badge) + '">' + esc(e.organizer_badge || 'Community Organizer') + '</span>'
      + (org ? '<span>by <b>' + esc(org.name) + '</b></span>' + (org.website_url ? ' · <a href="' + esc(org.website_url) + '"' + EXT + '>Website ↗</a>' : '')
             : (e.organizer_name ? '<span>by <b>' + esc(e.organizer_name) + '</b></span>' + (e.organizer_website_url ? ' · <a href="' + esc(e.organizer_website_url) + '"' + EXT + '>Organizer website ↗</a>' : '') : (e.organizer_badge === 'Advantage' ? '<span>Presented by Advantage</span>' : ''))) + '</div>'
      + '<div class="meta">'
      + '<div class="r"><span class="ic">📅</span><span><b>' + fmtRange(e.start_at, e.end_at) + '</b></span></div>'
      + (loc ? '<div class="r"><span class="ic">📍</span><span>' + esc(loc) + '</span></div>' : '')
      + (e.event_format === 'online'
          ? '<div class="r"><span class="ic">💻</span><span style="color:#637488">Online event - no physical sale address required.</span></div>'
          : (e.address_pending ? '<div class="r"><span class="ic">🔒</span><span style="color:#637488">Address will be released closer to the sale.</span></div>' : ''))
      + '</div>'
      + (e.description ? '<div class="desc">' + esc(e.description) + '</div>' : '')
      + gallery
      + leaving
      + '<div class="cta">'
      + (mapsQ ? '<a class="btn ghost" href="https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(mapsQ) + '"' + EXT + '>Get directions ↗</a>' : '')
      + '</div>'
      + (e.attribution_source ? '<div class="attrib">Listing sourced from ' + esc(e.attribution_source) + (e.attribution_url ? ' (<a href="' + esc(e.attribution_url) + '"' + EXT + '>source ↗</a>)' : '') + '. Not hosted or endorsed by Advantage.Bid.</div>' : '')
      + '<div id="related"></div>';

    loadRelated();
  }).catch(function () { content.innerHTML = '<div class="err">Couldn’t load this event. Please try again.</div>'; });
})();
</script>
</body>
</html>
