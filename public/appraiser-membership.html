<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Appraiser Membership - Advantage.Bid</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/widgets/shared/onboarding.css" />
  <style>
    /* Adopts the shared Advantage.Bid onboarding design tokens (onboarding.css). */
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: var(--ob-body); background: var(--ob-paper); color: var(--ob-ink); }
    .wrap { max-width: 560px; margin: 0 auto; padding: 2.25rem 1.15rem 3rem; }
    .card { background: var(--ob-surface); border: 1px solid var(--ob-hair); border-radius: 16px; padding: 1.7rem 1.6rem 1.9rem; box-shadow: var(--ob-shadow); }
    h1 { font-family: var(--ob-serif); font-weight: 700; font-size: 1.6rem; margin: 0 0 .35rem; letter-spacing: -.01em; }
    .price { font-size: 1.05rem; font-weight: 800; color: #0f172a; margin: 0 0 .1rem; }
    .price span { font-weight: 600; color: #64748b; font-size: .92rem; }
    .lead { color: #475569; font-size: .95rem; line-height: 1.5; margin: .35rem 0 1.2rem; }
    ul.incl { list-style: none; margin: 0 0 1.3rem; padding: 0; }
    ul.incl li { position: relative; padding: .34rem 0 .34rem 1.6rem; font-size: .95rem; color: #1f2937; line-height: 1.4; }
    ul.incl li::before { content: "✓"; position: absolute; left: 0; top: .34rem; color: #16a34a; font-weight: 800; }
    .terms { font-size: .82rem; color: #64748b; line-height: 1.5; background: #f8fafc; border: 1px solid #eef1f5; border-radius: 10px; padding: .8rem .9rem; margin-bottom: 1.25rem; }
    .terms b { color: #334155; }
    button.cta { width: 100%; background: var(--ob-accent); color: #fff; border: 0; border-radius: 12px; padding: .95rem 1rem; font-size: 1rem; font-weight: 800; cursor: pointer; transition: background .14s; }
    button.cta:hover:not(:disabled) { background: var(--ob-accent-ink); }
    button.cta:disabled { opacity: .6; cursor: default; }
    button.ghost { background: #eef2f7; color: #0f172a; }
    button.ghost:hover:not(:disabled) { background: #e2e8f0; }
    .row { display: flex; gap: .7rem; flex-wrap: wrap; }
    .row > button { flex: 1 1 46%; }
    .msg { font-size: .86rem; margin-top: .9rem; min-height: 1em; }
    .msg.err { color: #b91c1c; } .msg.ok { color: #15803d; }
    .secure { display: flex; align-items: center; gap: .45rem; font-size: .8rem; color: #64748b; margin-top: 1rem; }
    .secure svg { width: 15px; height: 15px; flex: 0 0 auto; }
    .foot { text-align: center; font-size: .8rem; color: #94a3b8; margin-top: 1.3rem; }
    .foot a { color: #2563eb; text-decoration: none; }
    .pill { display: inline-block; font-size: .74rem; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; padding: .22rem .6rem; border-radius: 999px; }
    .pill.active { background: #dcfce7; color: #15803d; }
    .pill.warn { background: #fef3c7; color: #92400e; }
    .banner { border-radius: 10px; padding: .7rem .85rem; font-size: .88rem; margin-bottom: 1.1rem; }
    .banner.canceled { background: #fff7ed; border: 1px solid #fed7aa; color: #9a3412; }
    .center { text-align: center; color: #64748b; padding: 1.5rem; }
    dl.status { margin: .2rem 0 1.2rem; }
    dl.status div { display: flex; justify-content: space-between; padding: .4rem 0; border-bottom: 1px solid #f1f5f9; font-size: .92rem; }
    dl.status dt { color: #64748b; } dl.status dd { margin: 0; font-weight: 700; color: #0f172a; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card" id="card">
      <div class="center" id="loading">Loading…</div>
    </div>
    <div class="foot">
      Questions? <a href="mailto:info@advantage.bid">info@advantage.bid</a> &nbsp;·&nbsp;
      <a href="/terms.html">Terms of Use</a> &nbsp;·&nbsp; <a href="/privacy.html">Privacy Policy</a>
    </div>
  </div>

  <script src="/widgets/shared/analytics.js"></script>
  <script src="/widgets/shared/auth-refresh.js"></script>
  <script src="/widgets/shared/buyer-nav.js"></script>
  <script>
    (function () {
      var token = localStorage.getItem('token');
      var params = new URLSearchParams(location.search);
      var card = document.getElementById('card');
      function track(ev, meta) { try { window.AAPAnalytics && AAPAnalytics.track(ev, meta || {}); } catch (e) {} }
      function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
      function fmtDate(d) { try { return new Date(d).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' }); } catch (e) { return ''; } }

      var SELL = ''
        + (params.get('canceled') ? '<div class="banner canceled">Checkout canceled. You have not been charged. You can start your membership whenever you are ready.</div>' : '')
        + '<h1>Appraiser Membership</h1>'
        + '<p class="price">$19.99 <span>per year</span></p>'
        + '<p class="lead">Join Advantage.Bid as a professional appraiser. Your annual membership lists your practice in the Advantage.Bid appraiser directory and keeps your profile discoverable to buyers and sellers.</p>'
        + '<ul class="incl">'
        + '<li>Annual Appraiser membership on Advantage.Bid</li>'
        + '<li>Your appraiser profile in the Advantage.Bid directory</li>'
        + '<li>Manage your billing, renewal, and cancellation any time</li>'
        + '</ul>'
        + '<div class="terms"><b>Annual billing.</b> Your membership renews automatically each year unless canceled. '
        + 'You can cancel any time from your account; access continues until the end of your paid period.</div>'
        + '<button class="cta" id="startBtn" type="button">Start Appraiser Membership</button>'
        + '<div class="msg" id="msg"></div>'
        + '<div class="secure"><svg viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>'
        + 'Secure payment processing. Your card details are encrypted and never stored on our servers.</div>';

      function renderSell() {
        card.innerHTML = SELL;
        document.getElementById('startBtn').addEventListener('click', startCheckout);
      }

      function renderActive(m) {
        var cancels = m.cancel_at_period_end;
        var end = m.current_period_end ? fmtDate(m.current_period_end) : '';
        card.innerHTML = ''
          + '<h1>Appraiser Membership</h1>'
          + '<p style="margin:.2rem 0 1rem"><span class="pill ' + (cancels ? 'warn' : 'active') + '">' + (cancels ? 'Cancels at period end' : 'Active') + '</span></p>'
          + '<dl class="status">'
          + '<div><dt>Plan</dt><dd>Appraiser Membership</dd></div>'
          + '<div><dt>Price</dt><dd>$19.99 / year</dd></div>'
          + (end ? '<div><dt>' + (cancels ? 'Access until' : 'Renews on') + '</dt><dd>' + esc(end) + '</dd></div>' : '')
          + '</dl>'
          + '<button class="cta" id="profileBtn" type="button">Complete Your Appraiser Profile</button>'
          + '<div class="row" style="margin-top:.7rem"><button class="cta ghost" id="billingBtn" type="button">Manage Billing</button></div>'
          + '<div class="msg" id="msg"></div>';
        document.getElementById('profileBtn').addEventListener('click', function () { location.href = '/org/profile.html'; });
        document.getElementById('billingBtn').addEventListener('click', openBilling);
      }

      function startCheckout() {
        var msg = document.getElementById('msg');
        if (!token) { location.href = '/login.html?next=' + encodeURIComponent('/appraiser-membership.html'); return; }
        var btn = document.getElementById('startBtn');
        btn.disabled = true; btn.textContent = 'Starting secure checkout…'; msg.className = 'msg'; msg.textContent = '';
        track('appraiser_checkout_started', { plan: 'annual' });
        var key = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now()) + Math.random();
        fetch('/api/appraiser/checkout-session', {
          method: 'POST',
          headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json', 'Idempotency-Key': key }
        }).then(function (r) {
          if (r.status === 401) { localStorage.removeItem('token'); location.href = '/login.html?next=' + encodeURIComponent('/appraiser-membership.html'); return null; }
          return r.json();
        }).then(function (d) {
          if (!d) return;
          if (d.success && d.url) { location.href = d.url; return; }
          btn.disabled = false; btn.textContent = 'Start Appraiser Membership';
          msg.className = 'msg err'; msg.textContent = d.message || 'Could not start checkout. Please try again.';
        }).catch(function () {
          btn.disabled = false; btn.textContent = 'Start Appraiser Membership';
          msg.className = 'msg err'; msg.textContent = 'Network error. Please try again.';
        });
      }

      function openBilling() {
        var msg = document.getElementById('msg');
        var btn = document.getElementById('billingBtn');
        btn.disabled = true; btn.textContent = 'Opening…'; msg.className = 'msg'; msg.textContent = '';
        fetch('/api/appraiser/billing-portal', { method: 'POST', headers: { 'Authorization': 'Bearer ' + token } })
          .then(function (r) { return r.json(); })
          .then(function (d) {
            if (d.success && d.url) { location.href = d.url; return; }
            btn.disabled = false; btn.textContent = 'Manage Billing';
            msg.className = 'msg err'; msg.textContent = d.message || 'Could not open billing. Please try again.';
          }).catch(function () {
            btn.disabled = false; btn.textContent = 'Manage Billing';
            msg.className = 'msg err'; msg.textContent = 'Network error. Please try again.';
          });
      }

      // Logged-out visitors see the pricing/signup state. Logged-in members see their status.
      if (!token) { renderSell(); return; }
      fetch('/api/appraiser/membership', { headers: { 'Authorization': 'Bearer ' + token } })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (d) {
          if (d && d.success && d.membership && d.membership.active) renderActive(d.membership);
          else renderSell();
        }).catch(function () { renderSell(); });
    })();
  </script>
</body>
</html>
