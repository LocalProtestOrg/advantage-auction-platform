<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Team Invitation · Advantage.Bid</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Inter,-apple-system,sans-serif;color:#0f172a;background:#f6f8fb}
    .wrap{max-width:560px;margin:0 auto;padding:32px 16px}
    h1{font-family:Fraunces,serif;font-size:24px;margin-bottom:10px}
    .card{background:#fff;border:1px solid #e6eaef;border-radius:14px;padding:20px}
    p{margin:8px 0;font-size:15px;line-height:1.5}
    .meta{color:#64748b;font-size:13px}
    .btn{border:none;border-radius:9px;padding:10px 16px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;background:#2563eb;color:#fff;margin-top:10px;text-decoration:none;display:inline-block}
    .err{color:#b91c1c}
  </style>
</head>
<body>
  <div class="wrap"><div class="card" id="box"><p class="meta">Loading your invitation…</p></div></div>
  <script>
    var token=localStorage.getItem('token')||'';
    // The invitation code arrives in the URL fragment (never sent to a server). Keep it in this tab only, drop it from the
    // address bar, and never put it in a sign-in redirect.
    var invite=''; try{invite=new URLSearchParams((location.hash||'').replace(/^#/,'')).get('token')||sessionStorage.getItem('staffInvite')||'';
      if(invite)sessionStorage.setItem('staffInvite',invite); if(location.hash)history.replaceState(null,'',location.pathname);}catch(e){}
    if(!token){location.href='/login.html?next='+encodeURIComponent('/seller-staff-invite.html');}
    function esc(s){return (s==null?'':String(s)).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
    var box=document.getElementById('box');
    function api(m,u,b){var o={method:m,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token}};if(b)o.body=JSON.stringify(b);return fetch(u,o).then(function(r){return r.json();});}
    api('POST','/api/seller-staff/invitations/preview',{token:invite}).then(function(r){
      if(!r.success){box.innerHTML='<h1>Invitation</h1><p class="err">'+esc(r.message||'This invitation is no longer valid.')+'</p>';return;}
      var d=r.data;
      box.innerHTML='<h1>Join '+esc(d.company)+'</h1><p>You have been invited to help manage <b>'+esc(d.company)+'</b> on Advantage.Bid as <b>'+esc(d.role_label)+'</b>.</p>'+
        (d.email_matches?'<button class="btn" id="accept">Accept invitation</button>'
          :'<p class="err">This invitation was sent to a different email address. Sign out and sign in with the invited email to accept it.</p>')+
        '<p class="meta">Your access is limited to this company and this role. The owner can change or end it at any time.</p>';
      var b=document.getElementById('accept'); if(!b)return;
      b.addEventListener('click',function(){b.disabled=true;
        api('POST','/api/seller-staff/invitations/accept',{token:invite}).then(function(x){
          if(!x.success){b.disabled=false;box.insertAdjacentHTML('beforeend','<p class="err">'+esc(x.message||'Could not accept.')+'</p>');return;}
          try{sessionStorage.removeItem('staffInvite');}catch(e){}
          var next=x.data.role==='inventory_manager'?'/seller-storefront.html?tab=market':'/seller-orders.html';
          box.innerHTML='<h1>Welcome to the team</h1><p>You now have '+esc(x.data.role_label)+' access to '+esc(x.data.company)+'.</p><a class="btn" href="'+next+'">Get started</a>';
        });
      });
    }).catch(function(){box.innerHTML='<p class="err">Network error.</p>';});
  </script>
</body>
</html>
