<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Account - Advantage.Bid</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    *,*::before,*::after{box-sizing:border-box}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f8fafc;color:#1f2937}
    .wrap{max-width:560px;margin:0 auto;padding:1.5rem 1rem 4rem}
    h1{font-size:1.4rem;margin:0 0 1rem}
    .card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:1.25rem 1.4rem;margin-bottom:1rem}
    .who{font-size:.95rem;color:#374151}.who strong{display:block;font-size:1.05rem;margin-bottom:2px}
    .links{display:flex;flex-direction:column}
    .links a,.links button{display:block;text-align:left;padding:.85rem 0;border:none;border-bottom:1px solid #f1f5f9;background:none;
      font-size:.95rem;font-weight:600;color:#1f2937;text-decoration:none;cursor:pointer}
    .links a:last-child,.links button:last-child{border-bottom:none}
    .links a:hover{color:#2563eb}
    .links .logout{color:#991b1b}
    .empty{padding:2rem;text-align:center;color:#64748b}
    .empty a{color:#2563eb;font-weight:700;text-decoration:none}
    .card h2{font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;color:#64748b;margin:0 0 .6rem}
    .fld{margin-bottom:.6rem}.fld label{display:block;font-size:.75rem;color:#64748b;margin-bottom:.2rem}
    .fld input{width:100%;padding:.55rem .6rem;border:1px solid #cbd5e1;border-radius:7px;font-size:.9rem}
    .fld input[disabled]{background:#f1f5f9;color:#64748b}
    .save{background:#2563eb;color:#fff;border:none;border-radius:7px;padding:.55rem 1.1rem;font-weight:700;cursor:pointer;font-size:.88rem}
    .pmsg{font-size:.8rem;color:#64748b;margin-left:.5rem}
    .fld select{width:100%;padding:.55rem .6rem;border:1px solid #cbd5e1;border-radius:7px;font-size:.9rem;background:#fff}
    .pill{display:inline-block;padding:.15rem .55rem;border-radius:999px;font-size:.72rem;font-weight:700}
    .pill.approved{background:#dcfce7;color:#166534}.pill.review{background:#fef9c3;color:#854d0e}
    .pill.rejected{background:#fee2e2;color:#991b1b}.pill.none{background:#f1f5f9;color:#475569}
    .hint{font-size:.78rem;color:#64748b;margin:.2rem 0 .7rem;line-height:1.45}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Account</h1>
    <div id="content" class="empty">Loading…</div>
  </div>
  <script src="/widgets/shared/auth-refresh.js"></script>
  <script src="/widgets/shared/buyer-nav.js"></script>
  <script>
    const token = localStorage.getItem('token');
    const content = document.getElementById('content');
    function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
    function menuFor(role){
      return '<div class="card links">'
        +(role==='seller' ? '<a href="/my-agreements.html">Seller Agreement &amp; signed documents</a>' : '')
        +'<a href="/my-bids.html">My Bids</a>'
        +'<a href="/watchlist.html">Watchlist</a>'
        +'<a href="/invoices.html">Past Invoices</a>'
        +'<a href="/billing.html">Billing &amp; Card on File</a>'
        +'<a href="/add-card.html?next=%2Faccount.html">Update payment method</a>'
        +'<button type="button" class="logout" id="logout">Log out</button>'
      +'</div>';
    }
    function profileCard(d){
      return '<div class="card"><h2>Profile</h2>'
        +'<div class="fld"><label>Email</label><input type="text" value="'+esc(d.email||'')+'" disabled></div>'
        +'<div class="fld"><label>Full name</label><input type="text" id="p-name" value="'+esc(d.full_name||'')+'" placeholder="Your name"></div>'
        +'<div class="fld"><label>Phone</label><input type="text" id="p-phone" value="'+esc(d.phone||'')+'" placeholder="Phone number"></div>'
        +'<button class="save" id="p-save">Save profile</button><span class="pmsg" id="p-msg"></span></div>';
    }
    async function load(){
      if(!token){ content.className='empty'; content.innerHTML='Please <a href="/login.html?next=%2Faccount.html">log in</a> to view your account.'; return; }
      let who = '<div class="card who"><strong>Signed in</strong></div>', prof = '', role = 'buyer';
      try{
        const r = await fetch('/api/auth/me', { headers:{ Authorization:'Bearer '+token } });
        if(r.status===401){ localStorage.removeItem('token'); content.className='empty'; content.innerHTML='Please <a href="/login.html?next=%2Faccount.html">log in</a> to view your account.'; return; }
        const d = await r.json();
        if(d.success && d.data){
          role = d.data.role || 'buyer';
          who = '<div class="card who"><strong>'+esc(d.data.email||'Your account')+'</strong>'+esc(role)+'</div>';
          prof = profileCard(d.data);
        }
      }catch(e){}
      const taxSection = '<div class="card" id="tax-card"><h2>Sales Tax Exemption</h2><div id="tax-body">Loading…</div></div>';
      content.className=''; content.innerHTML = who + prof + taxSection + menuFor(role);
      const lo = document.getElementById('logout');
      if(lo) lo.addEventListener('click', () => { localStorage.removeItem('token'); location.href='/'; });
      loadTax();
      const ps = document.getElementById('p-save');
      if(ps) ps.addEventListener('click', async () => {
        const msg = document.getElementById('p-msg'); msg.textContent = 'Saving…';
        try{
          const r = await fetch('/api/auth/me', { method:'PATCH', headers:{ 'Content-Type':'application/json', Authorization:'Bearer '+token }, body: JSON.stringify({ full_name: document.getElementById('p-name').value, phone: document.getElementById('p-phone').value }) });
          const d = await r.json(); msg.textContent = (r.ok && d.success) ? '✓ Saved' : (d.error || 'Failed');
        }catch(e){ msg.textContent = 'Failed'; }
      });
    }

    // ── Sales Tax Exemption (buyer) ─────────────────────────────────────────────
    const TAX_STATUS = {
      not_submitted: { pill:'none',     label:'Not Submitted' },
      under_review:  { pill:'review',   label:'Under Review' },
      approved:      { pill:'approved', label:'Approved' },
      rejected:      { pill:'rejected', label:'Additional Information Needed' },
      more_info:     { pill:'rejected', label:'Additional Information Needed' },
    };
    function taxForm(d){
      const showForm = !d || d.status === 'not_submitted' || d.status === 'rejected' || d.status === 'more_info';
      let html = '';
      const st = (d && d.status) || 'not_submitted';
      const meta = TAX_STATUS[st] || TAX_STATUS.not_submitted;
      html += '<p><span class="pill '+meta.pill+'">'+meta.label+'</span></p>';
      if(st === 'approved'){
        html += '<p class="hint">Your sales tax exemption is approved'
          + (d.jurisdiction_state ? ' for '+esc(d.jurisdiction_state) : '')
          + (d.expiration_date ? ' (expires '+esc(String(d.expiration_date).slice(0,10))+')' : '')
          + '. Applicable purchases will be tax-exempt when sales tax applies.</p>';
      } else if(st === 'under_review'){
        html += '<p class="hint">Your exemption certificate is under review by Advantage.Bid. Uploading a certificate does not by itself make you tax-exempt — we verify it first.</p>';
      }
      if(showForm){
        html += '<p class="hint">To request tax-exempt status, upload an applicable sales tax exemption or resale certificate. Advantage.Bid reviews and approves exemptions; a document alone does not grant exemption.</p>'
          + '<div class="fld"><label>Exemption type</label><select id="tx-type">'
          + '<option value="">Select…</option><option value="resale">Resale certificate</option>'
          + '<option value="state_exemption">State exemption certificate</option>'
          + '<option value="streamlined_sst">Streamlined Sales Tax certificate</option>'
          + '<option value="mtc">Multistate Tax Commission certificate</option>'
          + '<option value="other">Other</option></select></div>'
          + '<div class="fld"><label>Applicable state</label><input type="text" id="tx-state" maxlength="2" placeholder="e.g. TX"></div>'
          + '<div class="fld"><label>Certificate / permit number (optional)</label><input type="text" id="tx-num" placeholder="Certificate number"></div>'
          + '<div class="fld"><label>Exemption certificate (PDF, JPG, or PNG)</label><input type="file" id="tx-file" accept=".pdf,.jpg,.jpeg,.png"></div>'
          + '<button class="save" id="tx-save">Submit for review</button><span class="pmsg" id="tx-msg"></span>';
      }
      return html;
    }
    async function loadTax(){
      const body = document.getElementById('tax-body');
      if(!body) return;
      let d = { status:'not_submitted' };
      try{
        const r = await fetch('/api/tax-exemption', { headers:{ Authorization:'Bearer '+token } });
        const j = await r.json(); if(j.success && j.data) d = j.data;
      }catch(e){}
      body.innerHTML = taxForm(d);
      const btn = document.getElementById('tx-save');
      if(btn) btn.addEventListener('click', submitTax);
    }
    function fileToB64(file){
      return new Promise((resolve, reject) => {
        const fr = new FileReader();
        fr.onload = () => resolve(String(fr.result).split(',')[1] || '');
        fr.onerror = () => reject(new Error('read failed'));
        fr.readAsDataURL(file);
      });
    }
    async function submitTax(){
      const msg = document.getElementById('tx-msg');
      const fileEl = document.getElementById('tx-file');
      const file = fileEl && fileEl.files && fileEl.files[0];
      if(!file){ msg.textContent = 'Please choose a certificate file.'; return; }
      msg.textContent = 'Uploading…';
      try{
        const b64 = await fileToB64(file);
        const r = await fetch('/api/tax-exemption', { method:'POST', headers:{ 'Content-Type':'application/json', Authorization:'Bearer '+token },
          body: JSON.stringify({
            exemption_type: document.getElementById('tx-type').value || null,
            jurisdiction_state: (document.getElementById('tx-state').value || '').toUpperCase() || null,
            certificate_number: document.getElementById('tx-num').value || null,
            filename: file.name, content_type: file.type, data_base64: b64,
          }) });
        const j = await r.json();
        if(r.ok && j.success){ msg.textContent = '✓ Submitted for review'; loadTax(); }
        else { msg.textContent = j.message || j.error || 'Submission failed'; }
      }catch(e){ msg.textContent = 'Submission failed'; }
    }

    load();
  </script>
</body>
</html>
