<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>My Events - Advantage.Bid</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/widgets/shared/advantage-ds.css" />
<link rel="stylesheet" href="/org/portal.css" />
</head>
<body>
<!-- Unified Marketplace shell mounts here; the page content below is moved into it. -->
<div id="adv-shell-root"></div>
<div id="org-content" hidden>
<div class="wrap">
  <p class="sub">Create and manage local events. Published events appear on Advantage.bid city pages.</p>
  <div id="usage" class="card" style="display:none"></div>
  <div id="content"><div class="loading">Loading…</div></div>
  <div id="fcHistory"></div>
  <div id="proUpgrade"></div>
</div>
</div>
<script src="/widgets/shared/auth-refresh.js"></script>
<script src="/widgets/shared/pro-upgrade-panel.js"></script>
<script src="/widgets/shared/member-nav-config.js"></script>
<script src="/widgets/shared/member-chrome.js"></script>
<script src="/org/portal.js"></script>
<script>
(async function () {
  if (!ORG.guard()) return;
  // Wrap this page in the SAME unified Marketplace shell as /app.html (single shared source).
  var ctx = await AdvChrome.mountStandalone({ activeHref: '/org/events.html', title: 'My Events' });
  if (!ctx) return;
  var content = document.getElementById('content'), usage = document.getElementById('usage');
  ORG.api('GET', '/api/org/events').then(function (d) {
    if (d.plan) {
      usage.style.display = '';
      usage.innerHTML = '<div class="usage"><span class="pill">' + ORG.esc(d.plan.tier) + ' plan</span>'
        + '<span>Active events: <b>' + (d.usage ? d.usage.active_events : 0) + '</b> / ' + d.plan.max_active_events + '</span>'
        + '<span>Images per event: <b>' + d.plan.max_event_images + '</b></span></div>';
    }
    var rows = d.events || [];
    if (!rows.length) {
      content.innerHTML = '<div class="card empty"><div class="big">' + (d.organization ? 'No events yet' : 'Welcome!') + '</div>'
        + '<p class="sub" style="margin:0 0 16px">' + (d.organization ? 'Create your first event to get started.' : 'Create your first event and we’ll set up your organization automatically.') + '</p>'
        + '<a class="btn primary" href="/org/event-new.html">＋ Create Event</a></div>';
      return;
    }
    content.innerHTML = '<div class="btnrow" style="margin:0 0 16px"><a class="btn primary" href="/org/event-new.html">＋ Create Event</a></div>'
      + '<div class="elist">' + rows.map(function (e) {
        var canEdit = (e.status === 'draft' || e.status === 'rejected');
        return '<div class="erow"><div class="meta"><div class="t">' + ORG.esc(e.title) + '</div>'
          + '<div class="s">' + ORG.statusChip(e.status) + ' &nbsp; ' + ORG.esc(e.market || '') + ' · ' + ORG.fmtDate(e.start_at)
          + (e.status === 'rejected' && e.review_reason ? (' · <span style="color:#b91c1c">' + ORG.esc(e.review_reason) + '</span>') : '') + '</div></div>'
          + '<div class="go"><a class="btn ghost" href="/org/event-edit.html?id=' + encodeURIComponent(e.id) + '">' + (canEdit ? 'Edit' : 'View') + '</a></div></div>';
      }).join('') + '</div>';
  }).catch(function (err) {
    content.innerHTML = '<div class="msg err" style="display:block">' + ORG.esc(err.message) + '</div>';
  });

  // Follower announcement history (Professional Sellers only; hidden when empty). Aggregate counts only —
  // recipient identities/emails are never exposed to sellers.
  ORG.api('GET', '/api/org/follower-campaigns').then(function (d) {
    var rows = (d && d.campaigns) || [];
    var host = document.getElementById('fcHistory'); if (!host || !rows.length) return;
    function chip(s) { return '<span class="pill">' + ORG.esc(s) + '</span>'; }
    host.innerHTML = '<div class="card" style="margin-top:18px"><h2 style="margin:0 0 4px">Follower announcements</h2>'
      + '<p class="sub" style="margin:0 0 12px">Emails Advantage.Bid sent to your followers on your behalf.</p>'
      + '<div class="elist">' + rows.map(function (c) {
        var stat = (c.status === 'queued')
          ? ('Sent to ' + (c.targeted_count || 0) + ' · delivered ' + (c.delivered_count || 0) + (c.failed_count ? (' · failed ' + c.failed_count) : ''))
          : (c.status === 'scheduled' ? 'Scheduled — sends when published' : c.status);
        return '<div class="erow"><div class="meta"><div class="t">' + ORG.esc(c.event_title || 'Event') + '</div>'
          + '<div class="s">' + chip(c.status) + ' &nbsp; ' + ORG.esc(stat) + (c.queued_at ? (' · ' + ORG.fmtDate(c.queued_at)) : '') + '</div></div>'
          + (c.event_slug ? ('<div class="go"><a class="btn ghost" href="/event.html?slug=' + encodeURIComponent(c.event_slug) + '">View</a></div>') : '') + '</div>';
      }).join('') + '</div></div>';
  }).catch(function () { /* silent — not a professional seller / none yet */ });

  // Tasteful, non-forced Professional Seller upgrade panel — shown only when the user is NOT already a
  // professional seller (so we never invite an existing pro to "upgrade"). /api/sellers/me 404s for
  // non-sellers; a professional seller_type hides it; individual/private sellers still see it.
  ORG.api('GET', '/api/sellers/me').then(function (d) {
    var t = d && d.data && d.data.seller_type;
    var isPro = ['auction_house', 'estate_sale_company', 'professional_liquidator'].indexOf(t) !== -1;
    if (!isPro && window.AdvProUpgrade) window.AdvProUpgrade.render('proUpgrade');
  }).catch(function () { if (window.AdvProUpgrade) window.AdvProUpgrade.render('proUpgrade'); });
})();
</script>
</body>
</html>
