<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Marketplace Item · Advantage.Bid</title>
  <!-- SSR-META -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://js.stripe.com/v3/"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Inter,-apple-system,sans-serif;color:#0f172a;background:#f6f8fb}
    .wrap{max-width:1000px;margin:0 auto;padding:24px 18px}
    a{color:#2563eb;text-decoration:none}
    .grid{display:grid;grid-template-columns:1.1fr 1fr;gap:26px}
    @media(max-width:760px){.grid{grid-template-columns:1fr}}
    h1{font-family:Fraunces,serif;font-size:28px;line-height:1.15}
    .price{font-family:Fraunces;font-size:34px;font-weight:700;margin:12px 0}
    .pill{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;background:#eef2ff;color:#3730a3;margin-right:6px}
    .pill-sold{background:#fee2e2;color:#991b1b}
    .card{background:#fff;border:1px solid #e6eaef;border-radius:14px;padding:20px}
    .btn{display:inline-flex;align-items:center;gap:7px;border:none;border-radius:10px;padding:12px 20px;font-weight:700;font-size:15px;cursor:pointer;font-family:inherit;text-decoration:none}
    .btn-primary{background:#2563eb;color:#fff}.btn-ghost{background:#fff;color:#0f172a;border:1px solid #e6eaef}
    .btn[disabled]{opacity:.5;cursor:not-allowed}
    .desc{white-space:pre-line;color:#334155;margin-top:14px;line-height:1.6}
    .meta{color:#64748b;font-size:14px;margin:6px 0}
    .crumb{color:#64748b;font-size:13px;margin-bottom:14px}
    label{display:block;font-size:13px;font-weight:600;margin:10px 0 4px}
    input,select{width:100%;padding:9px 11px;border:1px solid #d7dde5;border-radius:8px;font-family:inherit;font-size:14px}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .lines{width:100%;border-collapse:collapse;margin:6px 0}
    .lines td{padding:4px 0;font-size:14px}
    .lines .tot td{border-top:1px solid #e2e8f0;padding-top:8px;font-weight:800;font-size:16px}
    #card-el{padding:11px;border:1px solid #d7dde5;border-radius:8px;background:#fff}
    .err{color:#b91c1c;font-size:13px;margin-top:8px}
    .ok{color:#166534}
    .modal{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:flex-start;justify-content:center;padding:24px;overflow:auto;z-index:50}
    .modal.on{display:flex}
    .sheet{background:#fff;border-radius:16px;max-width:460px;width:100%;padding:22px;margin-top:24px}
    .sheet h3{font-family:Fraunces;font-size:20px;margin-bottom:4px}
  </style>
  <script src="/widgets/shared/lot-image.js"></script>
  <script src="/widgets/shared/image-gallery.js"></script>
  <!-- SSR-JSONLD -->
  <style>
    .more{margin-top:8px}.more h2{font-family:Fraunces,serif;font-size:20px;margin:0 0 12px}
    .more-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
    .more-card{display:block;background:#fff;border:1px solid #e6eaef;border-radius:12px;padding:8px;color:inherit;text-decoration:none;font-size:13px}
    .more-card img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:8px;display:block;margin-bottom:6px}
    .more-card span{display:block;margin-bottom:2px}
  </style>
  <style>
    /* Approved item page layout (2026-11-20). */
    body{background:#fff}
    .wrap{max-width:1180px}
    .crumb{margin:4px 0 18px;font-size:14px}
    .grid{grid-template-columns:minmax(0,1.12fr) minmax(0,1fr);gap:36px;align-items:start}
    h1{font-size:clamp(26px,3.3vw,38px);letter-spacing:-.01em}
    .summary .meta{font-size:15px}
    .price{font-size:36px;margin:14px 0 6px}
    .price .pill-sold{font-family:Inter,-apple-system,sans-serif;font-size:16px;font-weight:800;padding:10px 18px;border-radius:10px;margin:0;display:inline-flex;align-items:center;gap:8px}
    .chips{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
    .chips .pill,.chip{display:inline-flex;align-items:center;gap:6px;background:#eef3fb;color:#14356b;border-radius:999px;padding:7px 14px;font-size:13px;font-weight:700;margin:0}
    .chip svg{flex:none}
    .acts{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0 0}
    .btn-pill{border-radius:999px;padding:9px 18px;font-size:14px}
    .btn-primary{background:#14356b}.btn-primary:hover{background:#0f2a57}
    .btn-block{display:flex;justify-content:center;width:100%;margin-top:10px}
    .gallery>img{display:inline-block;width:72px;height:72px;object-fit:cover;border-radius:10px;margin:8px 8px 0 0}
    .gallery>img#main{display:block;width:100%;height:auto;max-height:560px;object-fit:contain;background:#f3f5f8;border-radius:14px;margin:0}
    @media(min-width:761px){
      #gallery .advg{flex-direction:row-reverse;align-items:flex-start;gap:14px}
      #gallery .advg-main{flex:1 1 auto;min-width:0}
      #gallery .advg-thumbs{flex:0 0 auto;flex-direction:column;flex-wrap:nowrap;max-height:560px;overflow:auto}
      #gallery .advg-thumb{width:76px;height:76px}
    }
    .lower{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(0,1fr);gap:36px;margin-top:38px;align-items:start}
    .sec-h{font-family:Fraunces,serif;font-size:24px;line-height:1.2;margin:0 0 12px}
    .desc{margin:0 0 26px;font-size:15.5px;line-height:1.7}
    .details table{width:100%;border-collapse:collapse;margin-bottom:10px}
    .details th{text-align:left;font-weight:700;font-size:14px;padding:9px 0;width:42%;vertical-align:top;border-bottom:1px solid #eef1f5}
    .details td{font-size:14px;padding:9px 0;color:#334155;border-bottom:1px solid #eef1f5}
    .details ul{list-style:none;margin:8px 0 0}
    .seller-card .seller-row{display:flex;align-items:center;gap:14px;margin-bottom:8px}
    .seller-logo{width:64px;height:64px;border-radius:12px;object-fit:contain;background:#fff;border:1px solid #e6eaef;flex:none}
    .seller-initial{display:flex;align-items:center;justify-content:center;font-family:Fraunces,serif;font-weight:700;font-size:26px;color:#14356b;background:#eef3fb}
    .seller-name{font-weight:700;font-size:17px;margin-bottom:4px}
    .badge-pro{display:inline-block;background:#fbbf24;color:#3a2a00;font-size:11.5px;font-weight:800;border-radius:999px;padding:3px 11px}
    .note{background:#eef4ff;border-radius:14px;padding:16px 18px;margin-top:18px;font-size:14px;color:#334155}
    .note b{display:block;color:#0f172a;font-size:15px;margin-bottom:4px}
    #shareBox{margin:18px 0 0}
    .more{max-width:1180px;margin:0 auto;padding:8px 18px 28px}
    @media(max-width:760px){.grid{grid-template-columns:1fr;gap:20px}.lower{grid-template-columns:1fr;gap:22px;margin-top:26px}.wrap{padding:16px 14px}.price{font-size:30px}}
  </style>
</head>
<body>
  <script>try{if(new URLSearchParams(location.search).get('ref')==='widget')window.ADV_PUBLIC_NAV_VARIANT='minimal';}catch(e){}</script>
  <div data-adv-public-nav></div>
  <div class="wrap" id="app"><!-- SSR-BODY:START --><p style="color:#64748b">Loading…</p><!-- SSR-BODY:END --></div>
  <!-- SSR-MORE -->
  <div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
  <script>
    // Canonical URL /shop/item/<id>/<slug> (server-rendered); older /item.html?id=<id> links are redirected to it.
    var FROM_WIDGET=false; try{FROM_WIDGET=new URLSearchParams(location.search).get('ref')==='widget';}catch(e){}
    // Website pass from the seller's embedded storefront (#wp=...): kept in this browser for that seller until it expires,
    // and removed from the address at once. The server verifies it; it only decides which commission the SELLER pays,
    // never the buyer's price.
    (function(){try{var m=/(?:^#|&)wp=([^&]+)/.exec(location.hash||'');if(!m)return;var t=decodeURIComponent(m[1]);
      var p=JSON.parse(atob(t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));
      if(p&&p.s&&p.exp>Date.now())localStorage.setItem('adv-wp-'+String(p.s).toLowerCase(),JSON.stringify({t:t,exp:p.exp}));
      history.replaceState(null,'',location.pathname+location.search);}catch(e){}})();
    // Every unexpired pass this browser holds (the item page does not know the seller's id; the server uses only the pass
    // signed for this item's seller). Expired ones are removed.
    function websitePasses(){var out=[];try{for(var i=localStorage.length-1;i>=0;i--){var k=localStorage.key(i);if(!k||k.indexOf('adv-wp-')!==0)continue;
      var v=null;try{v=JSON.parse(localStorage.getItem(k)||'null');}catch(e){}
      if(v&&v.t&&v.exp>Date.now())out.push(v.t);else localStorage.removeItem(k);}}catch(e){}return out.slice(0,10);}
    var ID=new URLSearchParams(location.search).get('id')||((location.pathname.match(/^\/shop\/item\/([0-9a-f-]{36})/i)||[])[1])||'';
    var token=localStorage.getItem('token')||'';
    var CFG={checkout_enabled:false,stripe_publishable_key:null};
    var ITEM=null, ORDER=null, stripe=null, cardEl=null;
    function esc(s){return (s==null?'':String(s)).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
    function money(c){return '$'+((c||0)/100).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});}
    function uuid(){return (crypto&&crypto.randomUUID)?crypto.randomUUID():('mo-'+Date.now()+'-'+Math.round(Math.random()*1e9));}
    function authHdr(){return token?{Authorization:'Bearer '+token}:{}; }

    Promise.all([
      fetch('/api/public/storefront/item/'+encodeURIComponent(ID),{headers:authHdr()}).then(function(r){return r.json();}),
      fetch('/api/marketplace/config',{headers:authHdr()}).then(function(r){return r.json();}).catch(function(){return {};})
    ]).then(function(a){
      var res=a[0]; if(a[1]&&a[1].data)CFG=a[1].data;
      if(!res.success){document.getElementById('app').innerHTML='<div style="text-align:center;padding:60px 0"><h1>Item not available</h1><p class="meta" style="margin-top:10px">This item may have sold or been removed.</p><p style="margin-top:18px"><a class="btn btn-primary" href="/shop">Browse the Marketplace</a></p></div>';return;}
      ITEM=res.data;render();
    }).catch(function(){document.getElementById('app').textContent='Unable to load item.';});

    // Links to this item's own seller's published policies (never another seller's).
    function policyLinks(it){
      var p=it.policies||{}; if(!it.storefront_slug||(!p.store_terms&&!p.shipping_pickup))return '';
      var b='/pro/'+encodeURIComponent(it.storefront_slug), a=[];
      if(p.store_terms)a.push('<a href="'+b+'/terms" target="_blank" rel="noopener">Store Terms &amp; Conditions</a>');
      if(p.shipping_pickup)a.push('<a href="'+b+'/shipping-pickup" target="_blank" rel="noopener">Shipping &amp; Pickup Policy</a>');
      return '<p class="meta" style="margin-top:12px">'+esc(it.seller_name||'Seller')+': '+a.join(' · ')+'</p>';
    }
    var IC={
      star:'<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>',
      truck:'<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M2 6h11v10H2zM13 9h4l4 4v3h-8z"/><circle cx="6.5" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/></svg>',
      pin:'<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.500C5 14.800 12 21 12 21z"/><circle cx="12" cy="9.500" r="2.300"/></svg>'
    };
    function chip(icon,text){return '<span class="chip">'+icon+esc(text)+'</span>';}
    function render(){
      var it=ITEM;
      document.title=it.title+' · Advantage.Bid';
      var imgs=(it.images&&it.images.length?it.images:(it.thumbnail_url?[it.thumbnail_url]:[]));
      var alts=it.image_alt||[];
      function alt(i){return (alts[i]&&String(alts[i]).trim())||(i===0?it.title:(it.title+' - photo '+(i+1)));}
      var loc=[it.city,it.state].filter(Boolean).join(', ');
      var sellerLink=it.storefront_public?('<a href="/pro/'+esc(it.storefront_slug)+'">'+esc(it.seller_name)+'</a>'):esc(it.seller_name||'Professional Seller');
      // Product structured data is rendered once, by the server, on the canonical page (one product record per item).

      var status=it.status||'active';
      // Item questions (on-platform, when enabled) replace the storefront contact form on item pages.
      var ask=(CFG.messaging_enabled||it.questions_enabled)?'<button class="btn btn-ghost" id="askBtn">Ask the seller a question</button>':
        '<button type="button" class="btn btn-ghost" id="contactBtn">Contact Seller</button>';
      var buyBox;
      if(status==='sold'){
        buyBox='<p class="meta" id="statusLine" style="font-size:15.5px;color:#334155">This item has been sold.</p>';
      } else if(status==='unavailable'){
        buyBox='<p class="meta" id="statusLine" style="font-size:15.5px;color:#334155">This item is no longer available for purchase.</p>';
      } else if(status==='pending_purchase'){
        buyBox='<div class="card" style="margin:16px 0"><span class="pill">Sale in progress</span><p class="meta" style="margin:10px 0 0">This item is temporarily unavailable while another buyer completes checkout. Check back shortly.</p></div>';
      } else if(CFG.checkout_enabled&&it.purchase_policies_ready!==false&&it.accepting_orders===true){   // accepting_orders: the seller can take an order now (verified, agreement, payout account)   // the seller's Store Terms and Shipping & Pickup Policy are required (server-enforced)
        buyBox='<div class="card" style="margin:16px 0"><div style="font-weight:700;margin-bottom:8px">Buy this item</div>'+
          '<p class="meta" style="margin:0 0 12px">Secure checkout through Advantage.Bid. '+(it.shippable?'Shipping or local pickup.':'Local pickup.')+'</p>'+
          '<button class="btn btn-primary" id="buyNow">Buy Now · '+money(it.price_cents)+'</button> '+ask+'</div>';
      } else if(CFG.messaging_enabled||it.questions_enabled){
        buyBox='<div class="card" style="margin:16px 0"><div style="font-weight:700;margin-bottom:8px">Interested in this item?</div><p class="meta" style="margin:0 0 12px">Ask '+esc(it.seller_name||'the seller')+' a question here on Advantage.Bid.</p><button class="btn btn-primary" id="askBtn">Ask the seller a question</button></div>';
      } else {
        buyBox='<div class="card" style="margin:16px 0"><div style="font-weight:700;margin-bottom:8px">Interested in this item?</div><p class="meta" style="margin:0 0 12px">Contact '+esc(it.seller_name)+' to purchase or ask questions.</p>'+'<button type="button" class="btn btn-primary" id="contactBtn">Contact Seller</button>'+'</div>';
      }

      var historical=(status==='sold'||status==='unavailable');
      var details=[['Condition',it.condition],['Category',it.category],['Era or period',it.era_or_period],['Location',loc],
        ['Pickup / Shipping',historical?'':((it.shipping&&it.shipping.summary)||'Local pickup available')],['Brand',it.brand],['Maker',it.manufacturer],['Material',it.material],['Model or part number',it.mpn]]
        .filter(function(r){return r[1];}).map(function(r){return '<tr><th scope="row">'+esc(r[0])+'</th><td>'+esc(r[1])+'</td></tr>';}).join('');
      // About the Seller: the seller's own name and logo, a link to their storefront (once published) and Contact Seller.
      var sellerPanel=it.seller_name?('<aside class="card seller-card" id="aboutSeller" aria-label="About the seller"><h2 class="sec-h">About the Seller</h2>'+
        '<div class="seller-row">'+(it.seller_logo_url?'<img class="seller-logo" src="'+esc(it.seller_logo_url)+'" alt="'+esc(it.seller_name)+' logo" width="64" height="64">':'<span class="seller-logo seller-initial" aria-hidden="true">'+esc(String(it.seller_name).slice(0,1))+'</span>')+
        '<div><div class="seller-name">'+esc(it.seller_name)+'</div><span class="badge-pro">Professional Seller</span></div></div>'+
        (it.storefront_public?'<a class="btn btn-ghost btn-block" id="visitStorefront" href="/pro/'+esc(it.storefront_slug)+'">Visit Seller Storefront</a>':'')+
        '<button type="button" class="btn btn-primary btn-block" id="sellerContactBtn">Contact Seller</button></aside>'):'';
      document.getElementById('app').innerHTML=
        '<nav class="crumb" aria-label="Breadcrumb"><a href="/">Advantage.Bid</a> › <a href="/shop">Marketplace</a> › '+sellerLink+'</nav>'+
        '<div class="grid"><div class="gallery" id="gallery"></div>'+
        '<div class="summary"><h1>'+esc(it.title)+'</h1><div class="meta">Sold by '+sellerLink+'</div>'+
        // A sold item's price is never shown, to anyone (owner 2026-11-19: storefront selling prices are private).
        '<div class="price">'+(status==='sold'?'<span class="pill pill-sold">SOLD</span>':(status==='unavailable'?'<span class="pill pill-sold">No longer available</span>':money(it.price_cents)))+'</div>'+
        '<div class="chips">'+(it.condition?chip(IC.star,it.condition):'')+chip(IC.truck,it.shippable?'Shipping available':'Local pickup')+(loc?chip(IC.pin,loc):'')+
          (it.is_oversized?chip('','Oversized item'):'')+(it.is_fragile?chip('','Fragile'):'')+(it.source_lot_id?chip('','Previously at auction'):'')+'</div>'+
        buyBox+
        '<div id="shareSlot"></div>'+
        '</div></div>'+
        '<div class="lower"><div>'+
          (it.description?'<h2 class="sec-h">Item Description</h2><div class="desc">'+esc(it.description)+'</div>':'')+
          '<div class="card details"><h2 class="sec-h">Item Details</h2><table>'+details+'</table>'+
          ((it.shipping&&it.shipping.notes)?'<p class="meta">'+esc(it.shipping.notes)+'</p>':'')+
          policyLinks(it)+
          '<p class="meta" style="margin-top:14px"><a href="#" id="reportLink">Report this listing</a></p></div>'+
        '</div><div>'+sellerPanel+
          (historical?'<div class="note" id="historyNote"><b>Why am I seeing this item?</b><p>This is a historical listing kept for reference. '+(status==='sold'?'This item has been sold.':'This item is no longer available for purchase.')+'</p></div>':'')+
        '</div></div>';
      var sc=document.getElementById('sellerContactBtn'); if(sc)sc.addEventListener('click',(CFG.messaging_enabled||it.questions_enabled)?openAsk:openContact);
      if(window.AdvGallery)AdvGallery.mount(document.getElementById('gallery'),{images:imgs,alts:it.image_alt||[],title:it.title});
      var b=document.getElementById('buyNow'); if(b)b.addEventListener('click',startCheckout);
      var rl=document.getElementById('reportLink'); if(rl)rl.addEventListener('click',function(e){e.preventDefault();openReport();});
      var ab=document.getElementById('askBtn'); if(ab)ab.addEventListener('click',openAsk);
      var cb=document.getElementById('contactBtn'); if(cb)cb.addEventListener('click',openContact);
      mountShare(it);
    }

    // Report a listing (signed-in). Our team reviews every report; a report is not a finding against the seller.
    function openReport(){
      if(!token){location.href='/login.html?next='+encodeURIComponent(location.pathname+location.search);return;}
      openModal('<h3>Report this listing</h3><div class="meta">Tell us what is wrong. Our team reviews every report.</div>'+
        '<label for="rc">What is the problem?</label><select id="rc">'+
        '<option value="">Choose one…</option><option value="prohibited_item">Item is not allowed to be sold</option><option value="counterfeit">Counterfeit or fake</option>'+
        '<option value="misleading">Misleading description or photos</option><option value="wrong_category">Wrong category</option><option value="offensive">Offensive content</option><option value="other">Something else</option></select>'+
        '<label for="rm">Details</label><textarea id="rm" rows="4" maxlength="2000" style="width:100%;padding:8px;border:1px solid #d7dde5;border-radius:8px;font-family:inherit"></textarea>'+
        '<div class="err" id="rErr"></div>'+
        '<div style="margin-top:16px;display:flex;gap:8px"><button class="btn btn-primary" id="rSend">Send report</button><button class="btn btn-ghost" id="rCancel">Cancel</button></div>');
      document.getElementById('rCancel').addEventListener('click',closeModal);
      document.getElementById('rSend').addEventListener('click',function(){
        var btn=this; btn.disabled=true;
        fetch('/api/marketplace/items/'+encodeURIComponent(ID)+'/report',{method:'POST',headers:Object.assign({'Content-Type':'application/json'},authHdr()),
          body:JSON.stringify({category:document.getElementById('rc').value,message:document.getElementById('rm').value})})
          .then(function(r){return r.json();}).then(function(res){
            if(!res.success){btn.disabled=false;document.getElementById('rErr').textContent=res.message||'Could not send the report.';return;}
            openModal('<h3>Thank you</h3><p class="meta">'+(res.data&&res.data.already_reported?'You already reported this listing. Our team will review it.':'Your report was sent. Our team will review it.')+'</p><div style="margin-top:16px"><button class="btn btn-primary" id="rDone">Close</button></div>');
            document.getElementById('rDone').addEventListener('click',closeModal);
          }).catch(function(){btn.disabled=false;document.getElementById('rErr').textContent='Network error.';});
      });
    }

    // Ask the seller a question (signed-in). The conversation stays on Advantage.Bid; contact details are hidden.
    function openAsk(){
      if(!token){location.href='/login.html?next='+encodeURIComponent(location.pathname+location.search);return;}
      openModal('<h3>Ask the seller a question</h3><div class="meta">About: '+esc(ITEM.title)+'. Replies arrive in <a href="/my-questions.html">My Questions</a> and by email.</div>'+
        '<label for="aq">Your question</label><textarea id="aq" rows="5" maxlength="2000" style="width:100%;padding:8px;border:1px solid #d7dde5;border-radius:8px;font-family:inherit"></textarea>'+
        '<p class="meta" style="margin-top:8px">For your safety, keep questions and payments on Advantage.Bid. Phone numbers, email addresses and links are hidden from the seller.</p>'+
        '<div class="err" id="aErr"></div>'+
        '<div style="margin-top:16px;display:flex;gap:8px"><button class="btn btn-primary" id="aSend">Send question</button><button class="btn btn-ghost" id="aCancel">Cancel</button></div>');
      document.getElementById('aCancel').addEventListener('click',closeModal);
      document.getElementById('aSend').addEventListener('click',function(){
        var btn=this; btn.disabled=true;
        fetch('/api/storefront-messages/items/'+encodeURIComponent(ID)+'/ask',{method:'POST',headers:Object.assign({'Content-Type':'application/json'},authHdr()),
          body:JSON.stringify({body:document.getElementById('aq').value})})
          .then(function(r){return r.json();}).then(function(res){
            if(!res.success){btn.disabled=false;document.getElementById('aErr').textContent=res.message||'Could not send your question.';return;}
            var d=res.data||{}, held=d.message&&d.message.status==='held';
            openModal('<h3>'+(held?'Waiting for a quick review':'Question sent')+'</h3><p class="meta">'+esc(d.notice||'The seller will reply here on Advantage.Bid. We will email you when they do.')+'</p>'+
              '<div style="margin-top:16px;display:flex;gap:8px"><a class="btn btn-primary" href="/my-questions.html?c='+encodeURIComponent(d.conversation_id||'')+'">View conversation</a><button class="btn btn-ghost" id="aDone">Close</button></div>');
            document.getElementById('aDone').addEventListener('click',closeModal);
          }).catch(function(){btn.disabled=false;document.getElementById('aErr').textContent='Network error.';});
      });
    }

    // Small DOM builder for the share box and the question form (no markup strings).
    function el(tag,attrs,kids){var n=document.createElement(tag);attrs=attrs||{};
      Object.keys(attrs).forEach(function(k){if(k==='text')n.textContent=attrs[k];else if(k==='on')Object.keys(attrs.on).forEach(function(e){n.addEventListener(e,attrs.on[e]);});else n.setAttribute(k,attrs[k]);});
      (kids||[]).forEach(function(c){if(c)n.appendChild(c);});return n;}

    // Share this item (owner 2026-11-10): the item's permanent page address, its title and main photo. Nothing about the
    // seller beyond what the page already shows.
    function itemUrl(){var c=document.querySelector('link[rel="canonical"]');return (c&&c.href)||(location.origin+location.pathname);}
    function mountShare(it){
      var col=document.getElementById('shareSlot')||document.querySelector('#app .grid > div:last-child'); if(!col||document.getElementById('shareBox'))return;
      var url=itemUrl(), title=it.title||'Item on Advantage.Bid', img=(it.images&&it.images[0])||it.thumbnail_url||'';
      var enc=encodeURIComponent, msg=el('span',{'class':'meta',id:'shareMsg',role:'status',style:'margin:0 0 0 4px'});
      function link(id,label,href){return el('a',{'class':'btn btn-ghost',id:id,href:href,target:'_blank',rel:'noopener',style:'padding:9px 14px;font-size:14px'},[document.createTextNode(label)]);}
      var row=el('div',{style:'display:flex;flex-wrap:wrap;gap:8px;align-items:center'});
      if(navigator.share){row.appendChild(el('button',{type:'button','class':'btn btn-primary',id:'shareNative',style:'padding:9px 14px;font-size:14px',text:'Share…',
        on:{click:function(){navigator.share({title:title,text:title,url:url}).catch(function(){});}}}));}
      row.appendChild(link('shareFacebook','Facebook','https://www.facebook.com/sharer/sharer.php?u='+enc(url)));
      row.appendChild(link('sharePinterest','Pinterest','https://www.pinterest.com/pin/create/button/?url='+enc(url)+(img?'&media='+enc(img):'')+'&description='+enc(title)));
      var mail=el('a',{'class':'btn btn-ghost',id:'shareEmail',href:'mailto:?subject='+enc(title)+'&body='+enc(title+'\n\n'+url),style:'padding:9px 14px;font-size:14px',text:'Email'});
      row.appendChild(mail);
      row.appendChild(el('button',{type:'button','class':'btn btn-ghost',id:'shareCopy',style:'padding:9px 14px;font-size:14px',text:'Copy Link',on:{click:function(){
        var done=function(){msg.textContent='Link copied.';};
        if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(url).then(done,function(){prompt('Copy this link:',url);});
        else prompt('Copy this link:',url);}}}));
      row.appendChild(msg);
      var box=el('div',{'class':'card',id:'shareBox',style:'margin:16px 0;padding:14px 16px'},[el('div',{style:'font-weight:700;margin-bottom:8px',text:'Share this item'}),row]);
      col.appendChild(box);
    }

    // Contact Seller (owner 2026-11-10): a question about THIS item, always available (whether or not the seller's
    // storefront page is published). It goes to the seller's Inquiries; the seller is told by email and replies directly.
    function openContact(){
      var sheet=document.getElementById('sheet'); sheet.textContent='';
      var f=function(id,label,type,req){return [el('label',{'for':id,text:label+(req?' *':'')}),el(type==='textarea'?'textarea':'input',type==='textarea'?{id:id,rows:'5',maxlength:'2000',style:'width:100%;padding:8px;border:1px solid #d7dde5;border-radius:8px;font-family:inherit'}:{id:id,type:type,maxlength:type==='email'?'160':'120',autocomplete:type==='email'?'email':(type==='tel'?'tel':'name')})];};
      var err=el('div',{'class':'err',id:'cErr',role:'alert'});
      var send=el('button',{type:'button','class':'btn btn-primary',id:'cSend',text:'Send question'});
      var cancel=el('button',{type:'button','class':'btn btn-ghost',id:'cCancel',text:'Cancel',on:{click:closeModal}});
      var trap=el('input',{id:'cWebsite',type:'text',tabindex:'-1',autocomplete:'off','aria-hidden':'true',style:'position:absolute;left:-9999px;width:1px;height:1px'});
      var nodes=[el('h3',{text:'Contact the seller'}),el('div',{'class':'meta',text:'About: '+(ITEM.title||'this item')+'. The seller replies to you directly.'})]
        .concat(f('cName','Your name','text',true),f('cEmail','Email','email',false),f('cPhone','Phone','tel',false),f('cMsg','Your question','textarea',true))
        .concat([el('p',{'class':'meta',style:'margin-top:8px',text:'Give an email or a phone number so the seller can reply.'}),trap,err,
          el('div',{style:'margin-top:16px;display:flex;gap:8px'},[send,cancel])]);
      nodes.forEach(function(n){sheet.appendChild(n);});
      document.getElementById('modal').classList.add('on');
      setTimeout(function(){var n=document.getElementById('cName');if(n)n.focus();},0);
      send.addEventListener('click',function(){
        var v=function(id){return (document.getElementById(id).value||'').trim();};
        var body={name:v('cName'),email:v('cEmail'),phone:v('cPhone'),message:v('cMsg'),company_website:v('cWebsite')};
        if(!body.name){err.textContent='Please enter your name.';return;}
        if(!body.email&&!body.phone){err.textContent='Please give an email or a phone number so the seller can reply.';return;}
        if(!body.message){err.textContent='Please write your question.';return;}
        send.disabled=true; err.textContent='';
        fetch('/api/public/storefront/item/'+encodeURIComponent(ID)+'/inquiry',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
          .then(function(r){return r.json();}).then(function(res){
            if(!res.success){send.disabled=false;err.textContent=res.message||'Your question could not be sent.';return;}
            sheet.textContent='';
            sheet.appendChild(el('h3',{text:'Question sent'}));
            sheet.appendChild(el('p',{'class':'meta',id:'cDoneMsg',text:res.message}));
            sheet.appendChild(el('div',{style:'margin-top:16px'},[el('button',{type:'button','class':'btn btn-primary',id:'cDone',text:'Done',on:{click:closeModal}})]));
          }).catch(function(){send.disabled=false;err.textContent='Network error. Please try again.';});
      });
    }

    function openModal(html){document.getElementById('sheet').innerHTML=html;document.getElementById('modal').classList.add('on');}
    function closeModal(){document.getElementById('modal').classList.remove('on');}
    document.addEventListener('keydown',function(e){if(e.key==='Escape'&&document.getElementById('modal').classList.contains('on'))closeModal();});

    function startCheckout(){
      if(!token){location.href='/login.html?next='+encodeURIComponent(location.pathname+location.search);return;}
      var it=ITEM;
      var methodSel=it.shippable?
        '<label>Fulfillment</label><select id="fm"><option value="pickup">Local pickup</option><option value="shipping">Shipping</option></select>':
        '<input type="hidden" id="fm" value="pickup"><div class="meta">Local pickup only</div>';
      // Quantity (migration 212): offered when more than one is available; the server reserves exactly this many.
      var avail=Math.max(1,parseInt(it.quantity,10)||1), maxQ=Math.min(avail,50), opts='';
      for(var i=1;i<=maxQ;i++)opts+='<option value="'+i+'"'+(i===QTY?' selected':'')+'>'+i+'</option>';
      var qtySel=avail>1?('<label>Quantity</label><select id="qty">'+opts+'</select><div class="meta">'+avail+' available</div>'):'<input type="hidden" id="qty" value="1">';
      openModal(
        '<h3>Checkout</h3><div class="meta">'+esc(it.title)+' · '+money(it.price_cents)+(avail>1?' each':'')+'</div>'+
        qtySel+
        methodSel+
        '<div id="addrWrap"></div>'+
        '<div class="err" id="coErr"></div>'+
        '<div style="margin-top:16px;display:flex;gap:8px"><button class="btn btn-primary" id="toReview">Continue</button><button class="btn btn-ghost" id="coCancel">Cancel</button></div>'
      );
      document.getElementById('coCancel').addEventListener('click',closeModal);
      var fm=document.getElementById('fm');
      function renderAddr(){
        var shipping=(fm.value==='shipping');
        document.getElementById('addrWrap').innerHTML=
          '<label>'+(shipping?'Shipping / billing address':'Billing address')+'</label>'+
          '<input id="a_name" placeholder="Full name">'+
          '<input id="a_line1" placeholder="Address line 1" style="margin-top:8px">'+
          '<input id="a_line2" placeholder="Address line 2 (optional)" style="margin-top:8px">'+
          '<div class="row" style="margin-top:8px"><input id="a_city" placeholder="City"><input id="a_state" placeholder="State" maxlength="2"></div>'+
          '<div class="row" style="margin-top:8px"><input id="a_zip" placeholder="ZIP"><input id="a_country" placeholder="Country" value="US"></div>';
      }
      renderAddr(); if(fm.tagName==='SELECT')fm.addEventListener('change',renderAddr);
      document.getElementById('toReview').addEventListener('click',toReview);
    }

    function collectAddr(){
      function v(id){return (document.getElementById(id)||{}).value||'';}
      return {name:v('a_name'),line1:v('a_line1'),line2:v('a_line2'),city:v('a_city'),state:v('a_state'),postal_code:v('a_zip'),country:v('a_country')||'US'};
    }

    function toReview(){
      var it=ITEM, method=document.getElementById('fm').value, addr=collectAddr();
      QTY=Math.max(1,parseInt((document.getElementById('qty')||{}).value,10)||1);
      var errEl=document.getElementById('coErr'); errEl.textContent='';
      document.getElementById('toReview').disabled=true;
      fetch('/api/marketplace/orders/quote',{method:'POST',headers:Object.assign({'Content-Type':'application/json'},authHdr()),
        body:JSON.stringify({item_id:it.id,quantity:QTY,fulfillment_method:method,address:addr,ship_to:method==='shipping'?addr:undefined})})
        .then(function(r){return r.json();}).then(function(res){
          document.getElementById('toReview').disabled=false;
          if(!res.success){errEl.textContent=res.message||'Could not calculate your order.';return;}
          REVIEWED=res.data.breakdown; REVIEWED_UNIT=res.data.item&&res.data.item.unit_price_cents; showReview(res.data,method,addr);
        }).catch(function(){document.getElementById('toReview').disabled=false;errEl.textContent='Network error.';});
    }

    function showReview(q,method,addr){
      var b=q.breakdown;
      var lines='<table class="lines">'+
        '<tr><td>'+(QTY>1?('Item ('+QTY+' &times; '+money(REVIEWED_UNIT!=null?REVIEWED_UNIT:ITEM.price_cents)+')'):'Item')+'</td><td align="right">'+money(b.item_price_cents)+'</td></tr>'+
        (b.shipping_cents>0?'<tr><td>Shipping</td><td align="right">'+money(b.shipping_cents)+'</td></tr>':'')+
        (b.tax_cents>0?'<tr><td>Sales tax</td><td align="right">'+money(b.tax_cents)+'</td></tr>':(q.tax_enabled?'<tr><td>Sales tax</td><td align="right">'+money(0)+'</td></tr>':''))+
        '<tr class="tot"><td>Total</td><td align="right">'+money(b.total_charge_cents)+'</td></tr></table>';
      openModal('<h3>Review your order</h3><div class="meta">'+esc(ITEM.title)+' · '+(method==='shipping'?'Shipping':'Local pickup')+'</div>'+
        lines+
        // The purchase rules in plain words (owner decisions 2026-11-09); the binding text is in the terms linked below.
        '<div class="meta" id="purchaseRules" style="margin-top:12px;font-size:13px;line-height:1.45"><b>Before you pay:</b> '+
          'sales are final once payment succeeds, so an order cannot be cancelled because you changed your mind. '+
          'Returns follow the seller&#39;s Store Terms, and pickup times and items that are not collected follow the seller&#39;s Shipping &amp; Pickup Policy. '+
          'If the item is materially different from its listing, or never arrives, tell us under Report a problem in My Purchases. '+
          'Please report a problem within 48 hours after pickup or 7 days after delivery. A refund never carries an extra fee.</div>'+
        '<label style="display:flex;gap:8px;align-items:flex-start;font-weight:400;margin-top:12px"><input type="checkbox" id="ackPol" style="width:auto;margin-top:3px"> <span>I have read and agree to '+
          (ITEM.policies&&(ITEM.policies.store_terms||ITEM.policies.shipping_pickup)&&ITEM.storefront_slug?(esc(ITEM.seller_name||'the seller')+'&#39;s '+
            [ITEM.policies.store_terms?'<a href="/pro/'+encodeURIComponent(ITEM.storefront_slug)+'/terms" target="_blank" rel="noopener">Store Terms</a>':'',
             ITEM.policies.shipping_pickup?'<a href="/pro/'+encodeURIComponent(ITEM.storefront_slug)+'/shipping-pickup" target="_blank" rel="noopener">Shipping &amp; Pickup Policy</a>':''].filter(Boolean).join(' and ')+' and ')
            :'')+'the Advantage.Bid <a href="/terms.html" target="_blank" rel="noopener">Terms of Service</a> and <a href="/buyer-terms.html" target="_blank" rel="noopener">Buyer Terms</a>.</span></label>'+
        '<label>Card details</label><div id="card-el"></div>'+
        '<div class="err" id="payErr"></div>'+
        '<div style="margin-top:16px;display:flex;gap:8px"><button class="btn btn-primary" id="payBtn">Pay '+money(b.total_charge_cents)+'</button><button class="btn btn-ghost" id="payCancel">Back</button></div>'+
        '<p class="meta" style="margin-top:10px;font-size:12px">You will be charged by Advantage.Bid. The seller receives their proceeds after fulfillment.</p>');
      document.getElementById('payCancel').addEventListener('click',startCheckout);
      if(!CFG.stripe_publishable_key){document.getElementById('payErr').textContent='Payments are not configured.';return;}
      stripe=Stripe(CFG.stripe_publishable_key);
      var elements=stripe.elements();
      cardEl=elements.create('card'); cardEl.mount('#card-el');
      document.getElementById('payBtn').addEventListener('click',function(){
        if(!document.getElementById('ackPol').checked){document.getElementById('payErr').textContent='Please confirm you have read and agree to the store policies and terms.';return;}
        pay(method,addr);});
    }

    // Server-confirmed card flow: the browser only turns the card field into a payment method; the server checks
    // the card (debit/credit only) and confirms the charge. "Try again" reuses the same order + payment.
    var ORDER_KEY=null; var REVIEWED=null;   // the price and shipping the buyer reviewed (the server refuses if they changed)
    // The Buyer Terms version linked on the review screen: the server records acceptance of exactly this version and
    // refuses (TERMS_CHANGED) if a newer one was published while the page was open.
    var BUYER_TERMS_V=null;
    fetch('/api/terms/current').then(function(r){return r.json();}).then(function(x){if(x&&x.success&&x.data)BUYER_TERMS_V=x.data.version_int;}).catch(function(){});
    var QTY=1, REVIEWED_UNIT=null;          // units chosen, and the unit price reviewed (the server compares the unit price)
    function orderKey(method,addr){return method+'|'+QTY+'|'+(method==='shipping'?JSON.stringify(addr):'');}
    function ensureOrder(method,addr){
      var key=orderKey(method,addr);
      if(ORDER&&ORDER_KEY===key&&ORDER.payment_status==='pending')return Promise.resolve(ORDER);
      var body={item_id:ITEM.id,quantity:QTY,fulfillment_method:method,address:addr};
      if(REVIEWED){body.expected_item_price_cents=(REVIEWED_UNIT!=null?REVIEWED_UNIT:ITEM.price_cents);body.expected_shipping_cents=REVIEWED.shipping_cents;}
      var ack=document.getElementById('ackPol'); body.policies_acknowledged=!!(ack&&ack.checked);
      if(BUYER_TERMS_V!=null)body.expected_buyer_terms_version=BUYER_TERMS_V;
      body.expected_policy_versions=ITEM.policy_versions||{store_terms:null,shipping_pickup:null};   // the versions this buyer was shown
      if(method==='shipping')body.ship_to=addr;
      var wp=websitePasses(); if(wp.length)body.channel_passes=wp;
      return fetch('/api/marketplace/orders',{method:'POST',headers:Object.assign({'Content-Type':'application/json','Idempotency-Key':uuid()},authHdr()),body:JSON.stringify(body)})
        .then(function(r){return r.json();}).then(function(res){
          if(!res.success){
            // The seller changed its policies (or price) since this page loaded: refresh the item so the buyer reviews the current ones.
            if(res.code==='TERMS_CHANGED'){var ap=document.getElementById('ackPol');if(ap)ap.checked=false;fetch('/api/terms/current').then(function(r){return r.json();}).then(function(x){if(x&&x.success&&x.data)BUYER_TERMS_V=x.data.version_int;}).catch(function(){});}
            if(res.code==='POLICIES_CHANGED'||res.code==='PRICE_CHANGED'){fetch('/api/public/storefront/item/'+encodeURIComponent(ID),{headers:authHdr()}).then(function(r){return r.json();}).then(function(x){if(x&&x.success){ITEM=x.data;}}).catch(function(){});}
            throw new Error(res.message||'Could not start payment.');
          }
          ORDER=res.data.order; ORDER_KEY=key; return ORDER;
        });
    }
    function postPay(body){
      return fetch('/api/marketplace/orders/'+encodeURIComponent(ORDER.id)+'/pay',{method:'POST',
        headers:Object.assign({'Content-Type':'application/json','Idempotency-Key':uuid()},authHdr()),body:JSON.stringify(body)})
        .then(function(r){return r.json();}).then(function(res){
          if(!res.success){
            if(res.code==='ORDER_NOT_PAYABLE'){ORDER=null;ORDER_KEY=null;}
            throw new Error(res.message||'Payment failed.');
          }
          var d=res.data;
          if(d.status==='requires_action'){
            return stripe.handleCardAction(d.client_secret).then(function(ar){
              if(ar.error)throw new Error('Card verification was not completed. Please try again or use another card.');
              return postPay({});
            });
          }
          return d;
        });
    }
    function pay(method,addr){
      var payBtn=document.getElementById('payBtn'), errEl=document.getElementById('payErr');
      errEl.textContent=''; payBtn.disabled=true; payBtn.textContent='Processing…';
      function failed(msg){payBtn.disabled=false;payBtn.textContent='Try again';errEl.textContent=msg||'Payment failed.';}
      ensureOrder(method,addr).then(function(){
        return stripe.createPaymentMethod({type:'card',card:cardEl,billing_details:{name:addr.name||undefined,
          address:{line1:addr.line1||undefined,line2:addr.line2||undefined,city:addr.city||undefined,state:addr.state||undefined,postal_code:addr.postal_code||undefined,country:addr.country||undefined}}});
      }).then(function(pmr){
        if(pmr.error)throw new Error(pmr.error.message||'Please check your card details.');
        return postPay({payment_method_id:pmr.paymentMethod.id});
      }).then(function(d){
        if(d&&(d.status==='succeeded'||d.status==='processing'))return pollOrder(ORDER.id,0);
        failed('Your payment could not be completed. Please try again.');
      }).catch(function(e){failed(e&&e.message?e.message:'Network error.');});
    }

    function pollOrder(orderId,tries){
      fetch('/api/marketplace/orders/'+encodeURIComponent(orderId),{headers:authHdr()}).then(function(r){return r.json();}).then(function(res){
        var o=res.data;
        if(o&&o.payment_status==='paid'){return confirmed(o);}
        if(tries>20){return confirmed(o,true);}
        setTimeout(function(){pollOrder(orderId,tries+1);},1500);
      }).catch(function(){setTimeout(function(){pollOrder(orderId,tries+1);},1500);});
    }

    function confirmed(o,slow){
      var next=(o&&o.fulfillment_method==='shipping')?'The seller will prepare and ship your item.':'The seller will prepare your item and mark it ready for pickup.';
      openModal('<h3 class="ok">✓ Order confirmed</h3>'+
        '<div class="meta">Order '+esc(o?o.order_number:'')+'</div>'+
        '<p style="margin:12px 0"><b>'+esc(ITEM.title)+'</b>'+(o&&o.quantity>1?' &times; '+o.quantity:'')+'</p>'+
        (o?'<table class="lines"><tr class="tot"><td>Paid</td><td align="right">'+money(o.total_charge_cents)+'</td></tr></table>':'')+
        '<p class="meta" style="margin:10px 0">'+esc(next)+'</p>'+
        (slow?'<p class="meta">Your payment is processing. You will see it in your purchases shortly.</p>':'')+
        '<div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap"><a class="btn btn-primary" href="/marketplace-purchases.html">My Purchases</a>'+
          // Started from the seller's own website (the shop widget opened this page): offer the way back. The address is the
          // seller's own website from their storefront settings (server), never one taken from the browser.
          (FROM_WIDGET&&ITEM.seller_website&&/^https?:\/\//i.test(ITEM.seller_website)?'<a class="btn btn-ghost" id="backToSeller" href="'+esc(ITEM.seller_website)+'" rel="noopener">Return to '+esc(ITEM.seller_name||'the seller')+'&#39;s website</a>':'')+
          '<button class="btn btn-ghost" onclick="location.reload()">Done</button></div>');
    }
  </script>
