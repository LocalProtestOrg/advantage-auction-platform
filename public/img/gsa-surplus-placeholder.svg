<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img"
     aria-label="Federal Surplus Auction — official auction photo not publicly available"
     preserveAspectRatio="xMidYMid slice" font-family="'Fraunces', Georgia, 'Times New Roman', serif">
  <defs>
    <linearGradient id="gsBg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#16324f"/>
      <stop offset="0.55" stop-color="#0f2740"/>
      <stop offset="1" stop-color="#0B1B2B"/>
    </linearGradient>
    <linearGradient id="gsSheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gsShield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe0f7"/>
      <stop offset="1" stop-color="#9db4d6"/>
    </linearGradient>
  </defs>

  <!-- Ground -->
  <rect width="800" height="600" fill="url(#gsBg)"/>
  <rect width="800" height="600" fill="url(#gsSheen)"/>

  <!-- Subtle neoclassical federal-building watermark (generic civic motif; not an official insignia) -->
  <g fill="#9db4d6" opacity="0.09" transform="translate(400 322)">
    <polygon points="-150,-70 150,-70 0,-140"/>            <!-- pediment -->
    <rect x="-160" y="-70" width="320" height="16"/>       <!-- architrave -->
    <g>                                                     <!-- columns -->
      <rect x="-140" y="-54" width="20" height="150"/>
      <rect x="-90"  y="-54" width="20" height="150"/>
      <rect x="-40"  y="-54" width="20" height="150"/>
      <rect x="20"   y="-54" width="20" height="150"/>
      <rect x="70"   y="-54" width="20" height="150"/>
      <rect x="120"  y="-54" width="20" height="150"/>
    </g>
    <rect x="-170" y="96"  width="340" height="14"/>        <!-- steps -->
    <rect x="-185" y="110" width="370" height="16"/>
  </g>

  <!-- Emblem: rounded shield with stars + bars (evokes federal, deliberately generic) -->
  <g transform="translate(400 168)">
    <path d="M0,-52 C34,-40 52,-38 62,-38 C62,10 40,44 0,64 C-40,44 -62,10 -62,-38 C-52,-38 -34,-40 0,-52 Z"
          fill="url(#gsShield)" stroke="#0B1B2B" stroke-opacity="0.25" stroke-width="2"/>
    <rect x="-62" y="-6" width="124" height="9" fill="#B5273B" opacity="0.9"/>
    <rect x="-62" y="10" width="124" height="9" fill="#B5273B" opacity="0.55"/>
    <path d="M-62,-38 C-52,-38 -34,-40 0,-52 C34,-40 52,-38 62,-38 L62,-9 L-62,-9 Z" fill="#16324f"/>
    <g fill="#FBFAF7">
      <circle cx="-30" cy="-28" r="4.2"/><circle cx="-10" cy="-30" r="4.2"/>
      <circle cx="10" cy="-30" r="4.2"/><circle cx="30" cy="-28" r="4.2"/>
      <circle cx="-20" cy="-16" r="4.2"/><circle cx="0" cy="-17" r="4.2"/><circle cx="20" cy="-16" r="4.2"/>
    </g>
  </g>

  <!-- Kicker badge -->
  <g transform="translate(400 286)" text-anchor="middle">
    <rect x="-166" y="-21" width="332" height="42" rx="21" fill="#ffffff" fill-opacity="0.08"
          stroke="#9db4d6" stroke-opacity="0.45" stroke-width="1.25"/>
    <text x="0" y="6" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif"
          font-size="18" font-weight="800" letter-spacing="3.5" fill="#e9f0fb">FEDERAL SURPLUS AUCTION</text>
  </g>

  <!-- Serif title -->
  <text x="400" y="372" text-anchor="middle" font-size="40" font-weight="700" fill="#FBFAF7"
        letter-spacing="0.2">U.S. Government Surplus</text>

  <!-- Owner-required message -->
  <text x="400" y="418" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif"
        font-size="20" font-weight="500" fill="#b8c6dc">Official auction photo not publicly available.</text>

  <!-- Divider + Advantage.Bid branding -->
  <line x1="330" y1="512" x2="470" y2="512" stroke="#9db4d6" stroke-opacity="0.35" stroke-width="1.25"/>
  <text x="400" y="552" text-anchor="middle" font-size="26" font-weight="700" fill="#FBFAF7">
    Advantage<tspan fill="#2F6BFF">.Bid</tspan></text>
</svg>
