<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="referrer" content="no-referrer" />
  <title>Claim Your Listing | Advantage.Bid</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    :root { --ink:#0f172a; --muted:#475569; --line:#e2e8f0; --accent:#1d4ed8; }
    * { box-sizing:border-box; }
    body { margin:0; background:#f8fafc; color:var(--ink); font:16px/1.55 system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif; }
    .wrap { max-width:600px; margin:0 auto; padding:28px 16px 56px; }
    .brand { font-weight:800; font-size:18px; margin:0 0 18px; } .brand a { color:var(--ink); text-decoration:none; }
    .card { background:#fff; border:1px solid var(--line); border-radius:14px; padding:22px 20px; margin:0 0 16px; }
    h1 { font-size:24px; line-height:1.25; margin:0 0 10px; } h2 { font-size:17px; margin:0 0 8px; }
    p { margin:0 0 12px; } .fine { font-size:13px; color:var(--muted); }
    .btn { display:block; width:100%; padding:14px 18px; font-size:16px; font-weight:700; border-radius:10px; border:0; background:var(--accent); color:#fff; cursor:pointer; text-align:center; text-decoration:none; }
    .btn:disabled { opacity:.6; cursor:wait; } .btn2 { background:#fff; color:var(--ink); border:1px solid #cbd5e1; font-weight:600; }
    label { display:block; font-weight:600; font-size:14px; margin:10px 0 4px; }
    input, textarea { width:100%; padding:12px; border:1px solid #cbd5e1; border-radius:8px; font-size:16px; font-family:inherit; }
    .err { background:#fef2f2; border:1px solid #fecaca; color:#991b1b; border-radius:8px; padding:10px 12px; margin:0 0 12px; }
    .ok { background:#f0fdf4; border:1px solid #bbf7d0; color:#166534; border-radius:8px; padding:10px 12px; margin:0 0 12px; }
    .hp { position:absolute; left:-9999px; } [hidden] { display:none !important; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand"><a href="/">Advantage.Bid</a></div>
    <div id="app" aria-live="polite"><div class="card"><p>Loading...</p></div></div>
    <div class="card"><h2>What is Advantage.Bid?</h2><p class="fine">An online marketplace where people find local estate sales and auctions, and where sellers run them. Questions? Call (551) 655-7050 or email info@advantage.bid.</p></div>
  </div>
<script>
(function () {
  'use strict';
  var app = document.getElementById('app');
  var qs = new URLSearchParams(location.search);
  var claimToken = qs.get('token') || '';
  var orgId = qs.get('org') || '';
  var authToken = null; try { authToken = localStorage.getItem('token'); } catch (e) {}

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function card(html) { app.innerHTML = '<div class="card">' + html + '</div>'; }

  // A claim link (older admin-issued links carried ?org=&token=) always opens the token-first page.
  if (claimToken) { location.replace('/claim/' + encodeURIComponent(claimToken)); return; }
  if (!/^[0-9a-f-]{36}$/i.test(orgId)) {
    card('<h1>Claim your listing</h1><p>Open this page from the "Claim this listing" button on your company\'s listing, or use the link in the email we sent to the address on your listing.</p>'
      + '<a class="btn btn2" href="/free-business-listing.html">Find or add your business</a>');
    return;
  }

  fetch('/api/public/listings/' + encodeURIComponent(orgId) + '/claim-context')
    .then(function (r) { return r.json().then(function (b) { return { ok: r.ok, body: b }; }); })
    .then(function (res) {
      if (!res.ok || !res.body.listing) { card('<h1>Listing not found</h1><p>We could not find this listing. It may have been removed.</p>'); return; }
      render(res.body.listing);
    })
    .catch(function () { card('<div class="err">We could not load this listing. Please check your connection and try again.</div>'); });

  function helpForm(l, dispute) {
    return '<div class="card" id="help"><h2>' + (dispute ? 'Is this your company?' : 'Can\'t get to that inbox?') + '</h2>'
      + '<p class="fine">' + (dispute
        ? 'This listing is already managed by an account. Tell us about your connection to the company and our team will review it. Ownership only changes after a review.'
        : 'Ask us for help. We will call the phone number on this listing to confirm, then set up your access.') + '</p>'
      + '<form id="f-help" novalidate><div id="e-help" class="err" hidden></div><div id="ok-help" class="ok" hidden></div>'
      + '<label for="h-name">Your name</label><input id="h-name" autocomplete="name" required maxlength="120">'
      + '<label for="h-role">Your role at the company</label><input id="h-role" maxlength="80">'
      + '<label for="h-phone">Best phone number for you</label><input id="h-phone" type="tel" autocomplete="tel" maxlength="40">'
      + '<label for="h-email">Your email</label><input id="h-email" type="email" autocomplete="email" maxlength="200">'
      + '<label for="h-msg">Anything we should know?</label><textarea id="h-msg" rows="3" maxlength="2000"></textarea>'
      + '<input class="hp" id="h-website" tabindex="-1" autocomplete="off" aria-hidden="true">'
      + '<button class="btn btn2" type="submit" style="margin-top:14px">Send to the Advantage.Bid team</button></form></div>';
  }

  function render(l) {
    var loc = [l.city, l.state].filter(Boolean).join(', ');
    if (l.claimed) {
      app.innerHTML = '<div class="card"><h1>' + esc(l.name) + ' is already claimed</h1><p>This listing is managed by an account on Advantage.Bid.</p></div>' + helpForm(l, true);
      wireHelp();
      return;
    }
    if (!l.claimable) {
      card('<h1>' + esc(l.name) + '</h1><p>This listing cannot be claimed online. Call (551) 655-7050 or email info@advantage.bid and we will help.</p>');
      return;
    }
    var send = l.self_request_available
      ? '<p>It\'s free. We\'ll send a claim link to the email address on this listing: <b>' + esc(l.masked_email) + '</b></p>'
        + '<div id="e-send" class="err" hidden></div><div id="ok-send" class="ok" hidden></div>'
        + '<button class="btn" id="send" type="button">Send my claim link</button>'
      : '<p>It\'s free. Claiming by email link isn\'t available for this listing online yet. Use one of the options below, or call (551) 655-7050.</p>';
    app.innerHTML = '<div class="card"><h1>Claim ' + esc(l.name) + '</h1>' + (loc ? '<p class="fine">' + esc(loc) + '</p>' : '') + send + '</div>'
      + '<div class="card"><h2>Use a different email?</h2><p class="fine">If your email address is on your company\'s web domain, sign in with it and claim directly.</p>'
      + (authToken ? '<div id="e-domain" class="err" hidden></div><button class="btn btn2" id="domain" type="button">I\'m signed in with my company email, claim now</button>'
                   : '<a class="btn btn2" href="/login.html?next=' + encodeURIComponent(location.pathname + location.search) + '">Sign in with your company email</a>')
      + '</div>' + helpForm(l, false);
    var b = document.getElementById('send');
    if (b) b.addEventListener('click', function () {
      b.disabled = true;
      fetch('/api/public/listings/' + encodeURIComponent(orgId) + '/claim-link', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' })
        .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, body: j }; }); })
        .then(function (r) {
          if (r.ok) { var ok = document.getElementById('ok-send'); ok.textContent = 'Sent. Check the inbox for ' + (r.body.masked_email || l.masked_email) + '. The link works for 14 days.'; ok.hidden = false; b.hidden = true; return; }
          b.disabled = false; var e = document.getElementById('e-send'); e.textContent = r.body.message || 'We could not send a link right now.'; e.hidden = false;
        }).catch(function () { b.disabled = false; });
    });
    var d = document.getElementById('domain');
    if (d) d.addEventListener('click', function () {
      d.disabled = true;
      fetch('/api/org/claim/' + encodeURIComponent(orgId), { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + authToken }, body: '{}' })
        .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, body: j }; }); })
        .then(function (r) {
          if (r.ok && r.body.success) { location.href = '/org/profile.html?claimed=1'; return; }
          d.disabled = false; var e = document.getElementById('e-domain'); e.textContent = r.body.message || 'We could not verify your connection to this company.'; e.hidden = false;
        }).catch(function () { d.disabled = false; });
    });
    wireHelp();
  }

  function wireHelp() {
    var f = document.getElementById('f-help');
    if (!f) return;
    f.addEventListener('submit', function (ev) {
      ev.preventDefault();
      var btn = f.querySelector('button'); btn.disabled = true;
      var body = { name: val('h-name'), role: val('h-role'), phone: val('h-phone'), email: val('h-email'), message: val('h-msg'), website: val('h-website') };
      fetch('/api/public/listings/' + encodeURIComponent(orgId) + '/claim-help', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
        .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, body: j }; }); })
        .then(function (r) {
          btn.disabled = false;
          if (r.ok) { var ok = document.getElementById('ok-help'); ok.textContent = 'Thank you. A person on our team will be in touch within one business day.'; ok.hidden = false; btn.hidden = true; return; }
          var e = document.getElementById('e-help'); e.textContent = r.body.message || 'Please try again.'; e.hidden = false;
        }).catch(function () { btn.disabled = false; });
    });
  }
  function val(id) { var el = document.getElementById(id); return el ? el.value : ''; }
})();
</script>
</body>
</html>
