<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Marketplace Orders · Advantage.Bid</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Inter,-apple-system,sans-serif;color:#0f172a;background:#f6f8fb}
    .wrap{max-width:960px;margin:0 auto;padding:24px 18px}
    a{color:#2563eb;text-decoration:none}
    h1{font-family:Fraunces,serif;font-size:26px;margin-bottom:4px}
    .sub{color:#64748b;font-size:14px;margin-bottom:18px}
    .order{background:#fff;border:1px solid #e6eaef;border-radius:14px;padding:16px 18px;margin-bottom:14px}
    .top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
    .t{font-weight:700}
    .pill{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;margin-right:6px}
    .pill-paid{background:#dcfce7;color:#166534}.pill-refunded{background:#fee2e2;color:#991b1b}
    .pill-ful{background:#eef2ff;color:#3730a3}.pill-elig{background:#fef9c3;color:#854d0e}
    .meta{color:#64748b;font-size:13px;margin:3px 0}
    .btn{border:none;border-radius:9px;padding:8px 14px;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;background:#2563eb;color:#fff;margin:6px 6px 0 0}
    .btn-ghost{background:#fff;color:#0f172a;border:1px solid #e6eaef}
    input{padding:7px 9px;border:1px solid #d7dde5;border-radius:7px;font-family:inherit;font-size:13px;margin:6px 6px 0 0}
    .err{color:#b91c1c;font-size:13px}
    .money{font-family:Fraunces;font-weight:700}
    .issue{background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;padding:8px 10px;margin-top:10px;font-size:13px}
    .issue textarea{width:100%;padding:8px;border:1px solid #d7dde5;border-radius:8px;font-family:inherit;font-size:13px;margin-top:6px}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Marketplace Orders</h1>
    <div class="sub">Fixed-price sales from your storefront. Advantage.Bid handles payment and settlement.</div>
    <div id="list"><p class="meta">Loading…</p></div>
  </div>
  <script>
    var token=localStorage.getItem('token')||'';
    function esc(s){return (s==null?'':String(s)).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
    function money(c){return '$'+((c||0)/100).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});}
    function dt(v){try{return new Date(v).toLocaleDateString();}catch(e){return '';}}
    function hdr(){return {Authorization:'Bearer '+token};}
    if(!token){location.href='/login.html?next=/seller-orders.html';}

    var ISSUES={}; var CAN_FULFIL=true; var CAN_RESPOND=true;
    // Staff see only what their role allows (the server enforces it; this just hides buttons they cannot use).
    fetch('/api/seller-staff/me',{headers:hdr()}).then(function(r){return r.json();}).then(function(res){
      var m=res&&res.data&&res.data.staff&&res.data.membership; if(!m)return;
      CAN_FULFIL=m.permissions.indexOf('company.orders.fulfil')>=0; CAN_RESPOND=m.permissions.indexOf('company.issues.respond')>=0;
      var s=document.querySelector('.sub'); if(s)s.textContent='Fixed-price sales for '+m.company+'. You are signed in as '+m.role_label+'.'; load();
    }).catch(function(){});
    var LABEL={not_received:'Item not received',not_as_described:'Not as described',damaged:'Damaged',pickup_problem:'Pickup problem',refund_request:'Refund request',other:'Other'};
    function load(){
      Promise.all([
        fetch('/api/marketplace/seller/orders',{headers:hdr()}).then(function(r){return r.json();}),
        fetch('/api/marketplace/seller/issues',{headers:hdr()}).then(function(r){return r.json();}).catch(function(){return {data:[]};})
      ]).then(function(a){
        var res=a[0];
        ISSUES={};((a[1]&&a[1].data)||[]).forEach(function(i){(ISSUES[i.order_id]=ISSUES[i.order_id]||[]).push(i);});
        if(!res.success){document.getElementById('list').innerHTML='<p class="err">'+esc(res.message||'Could not load orders.')+'</p>';return;}
        var rows=res.data||[];
        if(!rows.length){document.getElementById('list').innerHTML='<p class="meta">No Marketplace orders yet.</p>';return;}
        document.getElementById('list').innerHTML=rows.map(card).join('');
        rows.forEach(wire);
      }).catch(function(){document.getElementById('list').innerHTML='<p class="err">Network error.</p>';});
    }

    function actions(o){
      if(o.payment_status!=='paid'||!CAN_FULFIL)return '';
      var a='';
      if(o.fulfillment_method==='pickup'){
        if(o.fulfillment_status==='unfulfilled')a+='<button class="btn" data-act="ready_for_pickup" data-id="'+o.id+'">Mark Ready for Pickup</button>';
        if(o.fulfillment_status==='unfulfilled'||o.fulfillment_status==='ready_for_pickup')a+='<button class="btn" data-act="picked_up" data-id="'+o.id+'">Pickup Complete</button>';
      } else {
        if(o.fulfillment_status==='unfulfilled')a+='<input placeholder="Carrier" id="c_'+o.id+'"><input placeholder="Tracking #" id="t_'+o.id+'"><button class="btn" data-act="shipped" data-id="'+o.id+'">Mark Shipped</button>';
        if(o.fulfillment_status==='shipped')a+='<button class="btn" data-act="complete" data-id="'+o.id+'">Mark Complete</button>';
      }
      return a;
    }

    function card(o){
      var pay=o.refund_status==='refunded'?'<span class="pill pill-refunded">Refunded</span>':(o.refund_status==='partially_refunded'?'<span class="pill pill-refunded">Partially refunded</span>':'<span class="pill pill-paid">Paid</span>');
      var ful='<span class="pill pill-ful">'+esc((o.fulfillment_status||'').replace(/_/g,' '))+'</span>';
      var elig=o.payout_eligible?'<span class="pill pill-elig">Payout eligible</span>':'';
      var track=o.tracking_number?('<div class="meta">Tracking: '+esc(o.tracking_carrier||'')+' '+esc(o.tracking_number)+'</div>'):'';
      return '<div class="order"><div class="top"><div>'+
        '<div class="t">'+esc(o.item_title||'Item')+(o.inventory_number?' <span class="meta">#'+esc(o.inventory_number)+'</span>':'')+'</div>'+
        '<div class="meta">Order '+esc(o.order_number)+' · '+dt(o.created_at)+' · '+(o.fulfillment_method==='shipping'?'Shipping':'Local pickup')+'</div>'+
        (o.buyer_name||o.buyer_email?'<div class="meta">Buyer: '+esc(o.buyer_name||'—')+(o.buyer_email?' · '+esc(o.buyer_email):'')+'</div>':'')+
        (o.ship_to?'<div class="meta">Ship to: '+esc(JSON.stringify(o.ship_to).replace(/[{}"]/g,' '))+'</div>':'')+
        track+
        '</div><div style="text-align:right"><div class="money">'+money(o.item_price_cents)+'</div>'+
        (o.seller_proceeds_cents!=null?'<div class="meta">Your proceeds: '+money(o.seller_proceeds_cents)+'</div>':'')+'</div></div>'+
        '<div style="margin-top:8px">'+pay+ful+elig+'</div>'+
        '<div>'+actions(o)+'</div>'+issuesFor(o)+'</div>';
    }

    // Buyer issues on this order. An issue is not a finding about your business; Advantage.Bid reviews it with you.
    function issuesFor(o){
      return (ISSUES[o.id]||[]).map(function(i){
        var body='<b>Buyer reported: '+esc(LABEL[i.category]||i.category)+'</b> · '+esc(String(i.status).replace(/_/g,' '))+'<div>'+esc(i.message)+'</div>';
        if(i.seller_response) body+='<div style="margin-top:4px"><b>Your response:</b> '+esc(i.seller_response)+'</div>';
        else if(i.status==='open'&&CAN_RESPOND) body+='<textarea id="r_'+esc(i.id)+'" rows="3" maxlength="4000" placeholder="Your response to the buyer and Advantage.Bid" aria-label="Your response"></textarea>'+
          '<button class="btn" data-respond="'+esc(i.id)+'">Send response</button>';
        if(i.resolution_note) body+='<div style="margin-top:4px"><b>Advantage.Bid:</b> '+esc(i.resolution_note)+'</div>';
        return '<div class="issue">'+body+'</div>';
      }).join('');
    }
    document.getElementById('list').addEventListener('click',function(ev){
      var id=ev.target.getAttribute('data-respond'); if(!id)return;
      ev.target.disabled=true;
      fetch('/api/marketplace/seller/issues/'+encodeURIComponent(id)+'/respond',{method:'POST',headers:Object.assign({'Content-Type':'application/json'},hdr()),
        body:JSON.stringify({response:(document.getElementById('r_'+id)||{}).value||''})})
        .then(function(r){return r.json();}).then(function(res){if(!res.success){alert(res.message||'Could not send.');ev.target.disabled=false;}else load();})
        .catch(function(){alert('Network error.');ev.target.disabled=false;});
    });

    function wire(o){
      document.querySelectorAll('[data-id="'+o.id+'"]').forEach(function(btn){
        btn.addEventListener('click',function(){
          var act=btn.getAttribute('act')||btn.getAttribute('data-act');
          var body={action:act};
          if(act==='shipped'){body.tracking_carrier=(document.getElementById('c_'+o.id)||{}).value||'';body.tracking_number=(document.getElementById('t_'+o.id)||{}).value||'';}
          btn.disabled=true;
          fetch('/api/marketplace/seller/orders/'+o.id+'/fulfillment',{method:'POST',headers:Object.assign({'Content-Type':'application/json'},hdr()),body:JSON.stringify(body)})
            .then(function(r){return r.json();}).then(function(res){if(!res.success){alert(res.message||'Could not update.');btn.disabled=false;}else load();})
            .catch(function(){alert('Network error.');btn.disabled=false;});
        });
      });
    }
    load();
  </script>
</body>
</html>
