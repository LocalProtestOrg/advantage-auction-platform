<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="canonical" href="https://bid.advantage.bid/buyer-terms.html" />
  <meta name="description" content="Advantage.Bid buyer terms and conditions of sale - bidding, buyer premium, payment, and pickup for the auction marketplace." />
  <title>Buyer Terms &amp; Conditions of Sale - Advantage.Bid</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    :root { color-scheme: light; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
           background: #f8fafc; color: #1f2937; }
    .wrap { max-width: 760px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
    .doc-card { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 1.75rem 1.9rem; }
    @media (max-width: 600px) { .doc-card { padding: 1.25rem 1rem; } }
    .doc h1 { font-size: 1.5rem; margin: 0 0 0.25rem; }
    .doc h2, .doc h3 { font-size: 1.05rem; margin: 1.3rem 0 0.4rem; scroll-margin-top: 1rem; }
    .meta { color: #6b7280; font-size: 0.85rem; margin-bottom: 1.25rem; }
    .doc p { line-height: 1.55; }
    .doc li { line-height: 1.5; margin: 0.25rem 0; }
    .doc a { color: #1d4ed8; }
    .doc hr { border: none; border-top: 1px solid #e5e7eb; margin: 1.3rem 0; }
    .doc table { width: 100%; border-collapse: collapse; font-size: 0.88rem; margin: 0.8rem 0; }
    .doc th, .doc td { border: 1px solid #e5e7eb; padding: 0.45rem 0.55rem; text-align: left; vertical-align: top; }
    .doc th { background: #f8fafc; }
    .md-table { overflow-x: auto; }
    .md-toc { background: #f8fafc; border: 1px solid #e5e7eb; border-radius: 10px; padding: 0.8rem 1rem; margin: 0 0 1.25rem; }
    .md-toc-title { font-weight: 700; font-size: 0.9rem; margin-bottom: 0.3rem; }
    .md-toc ol { margin: 0.2rem 0 0 1.2rem; padding: 0; }
    .md-toc li { font-size: 0.88rem; margin: 0.15rem 0; }
    .accept-bar { position: sticky; bottom: 0; margin-top: 1.5rem; background: #fff;
                  border: 1px solid #e5e7eb; border-radius: 12px; padding: 1rem 1.2rem;
                  display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
    .accept-bar .status { font-size: 0.9rem; color: #374151; }
    .accept-bar .status.ok { color: #15803d; font-weight: 600; }
    .accept-bar button { background: #1d4ed8; color: #fff; border: none; border-radius: 8px;
                         padding: 0.7rem 1.3rem; font-size: 0.95rem; font-weight: 700; cursor: pointer; }
    .accept-bar button:disabled { opacity: 0.55; cursor: default; }
    .signin a { color: #1d4ed8; font-weight: 600; text-decoration: none; }
    .loading { color: #6b7280; padding: 2rem; text-align: center; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="doc-card">
      <div id="doc-meta" class="meta" hidden></div>
      <div id="doc-body" class="loading">Loading terms…
        <noscript>Please turn on JavaScript to read the current terms. Questions: info@advantage.bid.</noscript>
      </div>
    </div>
    <div class="accept-bar" id="accept-bar" style="display:none">
      <div class="status" id="accept-status"></div>
      <div id="accept-action"></div>
    </div>
  </div>

  <script src="/widgets/shared/auth-refresh.js"></script>
  <script src="/widgets/shared/buyer-nav.js"></script>
  <script src="/widgets/shared/md-render.js"></script>
  <script src="/widgets/shared/terms-page.js"></script>
  <script>
    const token = localStorage.getItem('token');
    // #5: preserve the return URL through the flow so accepting terms never dead-ends: we send the
    // bidder back to the auction/lot they came from. SECURITY: only a safe, SAME-ORIGIN internal path is
    // honored (never an open redirect). Anything that isn't a single-slash-rooted path ('//host',
    // 'https://evil', 'javascript:...', or a cross-origin URL) is rejected and we fall back to no return.
    function safeInternalNext(raw) {
      if (!raw) return '';
      try {
        if (!/^\/(?!\/)[^\s]*$/.test(raw)) return '';           // must start with exactly one '/'
        const u = new URL(raw, location.origin);
        return u.origin === location.origin ? (u.pathname + u.search + u.hash) : '';
      } catch (e) { return ''; }
    }
    const NEXT = safeInternalNext(new URLSearchParams(location.search).get('next') || '');

    // The full CURRENT terms version, rendered by the shared safe renderer (the same one /terms.html uses).
    async function load() {
      const t = await AdvTermsPage.mount({ docId: 'doc-body', metaId: 'doc-meta' });
      if (t) await renderAcceptBar(t.version_int);
    }

    function signinLink(text, href) {
      const span = document.createElement('span'); span.className = 'signin';
      const a = document.createElement('a'); a.href = href; a.textContent = text; span.appendChild(a);
      return span;
    }

    async function renderAcceptBar(versionInt) {
      const bar = document.getElementById('accept-bar');
      const status = document.getElementById('accept-status');
      const action = document.getElementById('accept-action');
      bar.style.display = 'flex';
      action.textContent = '';
      if (!token) {
        status.textContent = 'Log in to accept these terms.';
        action.appendChild(signinLink('Log In or Create an Account', '/login.html?next=' + encodeURIComponent(location.pathname + location.search)));
        return;
      }
      let accepted = false;
      try {
        const r = await fetch('/api/terms/me/acceptance', { headers: { Authorization: 'Bearer ' + token } });
        if (r.status === 401) { localStorage.removeItem('token'); }
        else { const d = await r.json(); accepted = d.success && d.data.accepted_current; }
      } catch {}
      if (accepted) {
        status.className = 'status ok';
        status.textContent = '✓ You have accepted the current terms (version ' + versionInt + ').';
        if (NEXT) action.appendChild(signinLink('Return to the Auction', NEXT));
        return;
      }
      status.className = 'status';
      status.textContent = 'You have not yet accepted the current terms (version ' + versionInt + ').';
      const btn = document.createElement('button');
      btn.textContent = 'Accept Terms';
      btn.addEventListener('click', async () => {
        btn.disabled = true; btn.textContent = 'Saving…';
        try {
          // The version shown on this page: if a newer one was published meanwhile, nothing is recorded (TERMS_CHANGED).
          const r = await fetch('/api/terms/accept', { method: 'POST',
            headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
            body: JSON.stringify({ version_int: versionInt }) });
          const d = await r.json();
          if (d.success) {
            status.className = 'status ok';
            action.textContent = '';
            // #5: never leave the bidder stranded; return to where they came from.
            if (NEXT) { status.textContent = '✓ Terms accepted. Returning you to the auction…'; setTimeout(() => { location.href = NEXT; }, 700); }
            else { status.textContent = '✓ Terms accepted. Thank you.'; }
          } else if (d.code === 'TERMS_CHANGED') {
            status.textContent = d.message; btn.remove(); setTimeout(() => { location.reload(); }, 1800);
          }
          else { btn.disabled = false; btn.textContent = 'Accept Terms'; status.textContent = d.message || 'Could not save. Try again.'; }
        } catch { btn.disabled = false; btn.textContent = 'Accept Terms'; status.textContent = 'Could not save. Try again.'; }
      });
      action.appendChild(btn);
    }

    load();
  </script>
</body>
</html>
