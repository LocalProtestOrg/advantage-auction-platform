<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Verification Documents - Advantage.Bid</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/widgets/shared/onboarding.css" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    *{box-sizing:border-box}
    body{font-family:-apple-system,Segoe UI,Roboto,sans-serif;margin:0;background:#f1f5f9;color:#1f2937}
    .wrap{max-width:740px;margin:1.5rem auto;padding:0 1rem}
    .card{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:1.2rem 1.4rem;margin-bottom:1rem}
    h1{font-size:1.2rem;margin:0 0 .3rem}
    .muted{color:#64748b;font-size:.88rem}
    .cat{border:1px solid #e5e7eb;border-radius:8px;padding:.8rem;margin:.6rem 0}
    .cat h3{margin:0 0 .35rem;font-size:.95rem;text-transform:capitalize}
    .badge{display:inline-block;padding:.1rem .55rem;border-radius:999px;font-size:.72rem;font-weight:600}
    .b-submitted{background:#dbeafe;color:#1e40af}.b-approved{background:#dcfce7;color:#166534}
    .b-rejected{background:#fee2e2;color:#991b1b}.b-more_info{background:#fef3c7;color:#92400e}
    button{background:#2563eb;color:#fff;border:0;border-radius:7px;padding:.5rem 1rem;font:inherit;cursor:pointer}
    button[disabled]{opacity:.5;cursor:not-allowed}
    input[type=file]{font:inherit;margin:.3rem 0}
    .err{color:#dc2626;font-size:.85rem}.ok{color:#166534;font-size:.85rem}
    a{color:#2563eb}
    /* Seller navigation and verification status (owner 2026-11-12): a clear way back after submitting, on any screen. */
    .vd-nav{display:flex;flex-wrap:wrap;gap:.5rem;margin:0 0 1rem}
    .vd-nav a{display:inline-flex;align-items:center;min-height:44px;padding:.5rem 1rem;border:1px solid #cbd5e1;border-radius:8px;background:#fff;color:#1e3a8a;font-weight:600;text-decoration:none}
    .vd-nav a.primary{background:#2563eb;border-color:#2563eb;color:#fff}
    .vd-nav a[hidden]{display:none}
    .vd-status{border-radius:10px;padding:1rem 1.2rem;margin-bottom:1rem;border:1px solid #bfdbfe;background:#eff6ff;color:#1e3a8a}
    .vd-status.s-approved{border-color:#bbf7d0;background:#f0fdf4;color:#14532d}
    .vd-status.s-more_info,.vd-status.s-rejected{border-color:#fde68a;background:#fffbeb;color:#78350f}
    .vd-status.s-documents_needed,.vd-status.s-not_submitted{border-color:#e5e7eb;background:#fff;color:#1f2937}
    .vd-status b{font-size:1rem}
    .vd-thanks{border-radius:10px;padding:1rem 1.2rem;margin-bottom:1rem;border:1px solid #bbf7d0;background:#f0fdf4;color:#14532d}
    .vd-status[hidden],.vd-thanks[hidden]{display:none}
    .wrap,.card{min-width:0;overflow-wrap:anywhere}
    .wrap input[type=text],.wrap select,.wrap input[type=file]{max-width:100%}
  </style>
</head>
<body class="ob-body">
  <div class="wrap">
    <nav class="vd-nav" id="vd-nav" aria-label="Seller navigation">
      <a class="primary" id="vd-dashboard" href="/app.html#home">Return to Dashboard</a>
      <a id="vd-storefront" href="/seller-storefront.html?tab=store" hidden>My Storefront</a>
    </nav>
    <div id="vd-thanks" class="vd-thanks" role="status" hidden></div>
    <div id="vd-status" class="vd-status" hidden></div>
    <div class="card">
      <h1>Verification documents</h1>
      <div class="muted">Advantage.Bid has requested the documents below. Your files are stored privately and reviewed only by Advantage staff. You can keep using your seller dashboard while these are reviewed.</div>
    </div>
    <div id="biz"></div>
    <div id="list"></div>
  </div>
  <script>
    var token = localStorage.getItem('token');
    var list = document.getElementById('list');
    var biz  = document.getElementById('biz');
    var CAT_LABEL = {
      government_id:'Government-issued ID', passport:'Passport', business_license:'Business license',
      tax_document:'Tax document', proof_of_ownership:'Proof of ownership', receipt_invoice:'Receipt or invoice',
      estate_authority:'Estate authority', probate_letter:'Probate letter',
      ein_verification:'IRS EIN confirmation (CP575 / 147C)', business_registration:'State business registration',
      other:'Other document'
    };
    var PRO_TYPES = ['auction_house','estate_sale_company','professional_liquidator','retail_gallery_studio'];
    var BIZ_STATUS = {
      not_submitted:{c:'b-submitted',t:'Documents Needed'}, documents_needed:{c:'b-submitted',t:'Documents Needed'},
      under_review:{c:'b-submitted',t:'Under Review'}, approved:{c:'b-approved',t:'Approved'},
      more_info:{c:'b-more_info',t:'Additional Information Needed'}, rejected:{c:'b-rejected',t:'Additional Information Needed'}
    };
    // What each status means for the seller, in plain words (status from GET /api/verification/business).
    var STATUS_TEXT = {
      not_submitted: 'Submit your business details and one supporting document below.',
      documents_needed: 'Submit your business details and one supporting document below.',
      under_review: 'Advantage.Bid is reviewing your documents. You can check your status on this page at any time.',
      approved: 'Your business is verified. No further documents are needed.',
      more_info: 'Advantage.Bid needs more information. Please submit an additional document below.',
      rejected: 'Advantage.Bid could not verify your business from the documents provided. Please submit an additional document below.'
    };
    var justSubmitted = false;
    // Status panel and confirmation are built with DOM calls (no markup in strings).
    function showStatus(d){
      var box = document.getElementById('vd-status');
      var st = (d && d.status) || 'not_submitted', meta = BIZ_STATUS[st] || BIZ_STATUS.not_submitted;
      box.className = 'vd-status s-'+st; box.textContent = '';
      var b = document.createElement('b'); b.id = 'vd-status-label';
      b.textContent = st === 'approved' ? 'Verified: business verification approved' : 'Verification status: '+meta.t;
      var p = document.createElement('div'); p.style.marginTop = '.3rem'; p.textContent = STATUS_TEXT[st] || '';
      box.appendChild(b); box.appendChild(p); box.hidden = false;
      var thanks = document.getElementById('vd-thanks');
      if(justSubmitted){
        thanks.textContent = 'Thank you. Your documents were submitted. Status: '+(st === 'under_review' ? 'Under review' : meta.t)+'. Advantage.Bid will review them, and you can check your status on this page at any time.';
        thanks.hidden = false;
      }
    }
    async function loadBusiness(){
      if(!token) return;
      var d;
      try{ var r = await fetch('/api/verification/business', { headers:{ Authorization:'Bearer '+token } }); var j = await r.json(); d = j && j.data; }catch(e){ return; }
      if(!d || !d.business_info || PRO_TYPES.indexOf(d.business_info.seller_type) === -1){ biz.innerHTML=''; return; } // professionals only
      document.getElementById('vd-storefront').hidden = false;   // My Storefront is a Professional Seller feature
      showStatus(d);
      if(d.status === 'approved'){ biz.innerHTML=''; return; }   // verified: nothing more to submit
      var info = d.business_info, meta = BIZ_STATUS[d.status] || BIZ_STATUS.not_submitted;
      var cats = (d.accepted_categories||['business_registration','business_license']).map(function(c){
        return '<option value="'+esc(c)+'">'+esc(CAT_LABEL[c]||c)+'</option>';
      }).join('');
      var gateNote = (d.gate && d.gate.blocked)
        ? '<div class="muted" style="margin:.4rem 0">Advantage.Bid must verify your business before your first sale can go live. You can keep building auctions and your catalog in the meantime.</div>' : '';
      biz.innerHTML = '<div class="card">'
        + '<h1>Business verification</h1>'
        + '<div class="muted">Provide your business details and at least one supporting document (state business registration or business license). Stored privately; reviewed only by Advantage staff. Please do not upload documents showing your EIN or Social Security number: your taxpayer ID is collected securely when you set up payouts.</div>'
        + '<p><span class="badge '+meta.c+'">'+meta.t+'</span></p>'
        + gateNote
        + '<div class="cat">'
        + '<label>Legal business name</label><br><input type="text" id="bz-legal" value="'+esc(info.legal_business_name||'')+'" style="width:100%;padding:.5rem;margin:.2rem 0"><br>'
        + '<label>DBA / business name (if different)</label><br><input type="text" id="bz-dba" value="'+esc(info.dba_name||'')+'" style="width:100%;padding:.5rem;margin:.2rem 0"><br>'
        + '<p class="muted" style="margin:.4rem 0">Taxpayer ID: '+esc(({not_provided:'collected when you set up payouts',pending:'being verified',verified:'verified',unverified:'not verified: please review your payout setup'})[(info.taxpayer_id&&info.taxpayer_id.status)||'not_provided'])+'</p>'
        + '<label>Business address</label><br><input type="text" id="bz-addr" value="'+esc(info.address_line1||'')+'" placeholder="Street address" style="width:100%;padding:.5rem;margin:.2rem 0">'
        + '<input type="text" id="bz-city" value="'+esc(info.city||'')+'" placeholder="City" style="width:48%;padding:.5rem;margin:.2rem 4% .2rem 0">'
        + '<input type="text" id="bz-state" value="'+esc(info.state||'')+'" placeholder="State" style="width:22%;padding:.5rem;margin:.2rem 4% .2rem 0">'
        + '<input type="text" id="bz-zip" value="'+esc(info.postal_code||'')+'" placeholder="ZIP" style="width:22%;padding:.5rem;margin:.2rem 0"><br>'
        + '<label>Document type</label><br><select id="bz-cat" style="width:100%;padding:.5rem;margin:.2rem 0">'+cats+'</select><br>'
        + '<label>Document file (PDF, JPG, or PNG)</label><br><input type="file" id="bz-file" accept="image/*,application/pdf"><br>'
        + '<button id="bz-up">Submit business verification</button> <span class="msg" id="bz-msg"></span>'
        + '</div></div>';
      var btn = document.getElementById('bz-up');
      if(btn) btn.addEventListener('click', submitBusiness);
    }
    function submitBusiness(){
      var msg = document.getElementById('bz-msg'); msg.className='msg'; msg.textContent='';
      var fileEl = document.getElementById('bz-file'); var f = fileEl && fileEl.files && fileEl.files[0];
      if(!f){ msg.className='msg err'; msg.textContent=' Choose a document file.'; return; }
      if(f.size > 15*1024*1024){ msg.className='msg err'; msg.textContent=' File exceeds 15 MB.'; return; }
      var reader = new FileReader();
      reader.onload = async function(){
        var btn = document.getElementById('bz-up'); btn.disabled = true; msg.textContent=' Uploading…';
        try{
          var res = await fetch('/api/verification/business', {
            method:'POST', headers:{ 'Content-Type':'application/json', Authorization:'Bearer '+token },
            body: JSON.stringify({
              business_info: {
                legal_business_name: document.getElementById('bz-legal').value || null,
                dba_name: document.getElementById('bz-dba').value || null,
                address_line1: document.getElementById('bz-addr').value || null,
                city: document.getElementById('bz-city').value || null,
                state: document.getElementById('bz-state').value || null,
                postal_code: document.getElementById('bz-zip').value || null
              },
              category: document.getElementById('bz-cat').value,
              filename: f.name, content_type: f.type, data_base64: String(reader.result)
            })
          });
          var json = await res.json();
          if(res.ok && json.success){ msg.className='msg ok'; msg.textContent=' Submitted for review.'; justSubmitted = true; await loadBusiness(); var t = document.getElementById('vd-thanks'); if(t && t.scrollIntoView) t.scrollIntoView({ block:'start' }); }
          else { msg.className='msg err'; msg.textContent=' '+(json.message||'Submission failed.'); btn.disabled=false; }
        }catch(e){ msg.className='msg err'; msg.textContent=' Network error.'; btn.disabled=false; }
      };
      reader.readAsDataURL(f);
    }
    function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]);}); }

    async function load(){
      if(!token){ list.innerHTML = '<div class="card">Please <a href="/login.html?next=%2Fverify-documents.html">log in</a> to view requested documents.</div>'; return; }
      try{
        var res = await fetch('/api/verification/requests/mine', { headers:{ Authorization:'Bearer '+token } });
        var json = await res.json();
        var reqs = (json && json.data) || [];
        if(!reqs.length){ list.innerHTML = '<div class="card muted">No documents are requested right now. If Advantage needs anything, it will appear here.</div>'; return; }
        list.innerHTML = reqs.map(reqCard).join('');
        reqs.forEach(wireReq);
      }catch(e){ list.innerHTML = '<div class="card err">Could not load requested documents. Please refresh.</div>'; }
    }
    function reqCard(r){
      var cats = (r.categories||[]).map(function(c){
        return '<div class="cat"><h3>'+esc(CAT_LABEL[c]||c)+'</h3>'
          +'<input type="file" data-req="'+esc(r.id)+'" data-cat="'+esc(c)+'" accept="image/*,application/pdf" />'
          +'<button data-up="'+esc(r.id)+'" data-cat="'+esc(c)+'">Upload</button>'
          +'<span class="msg" data-msg="'+esc(r.id)+'-'+esc(c)+'"></span></div>';
      }).join('');
      return '<div class="card"><div class="muted">Requested '+(r.message?(': '+esc(r.message)):'')+'</div>'+cats+'</div>';
    }
    function wireReq(r){
      (r.categories||[]).forEach(function(c){
        var btn = document.querySelector('button[data-up="'+r.id+'"][data-cat="'+c+'"]');
        if(!btn) return;
        btn.addEventListener('click', function(){ upload(r.id, c, btn); });
      });
    }
    function upload(reqId, cat, btn){
      var msg = document.querySelector('span[data-msg="'+reqId+'-'+cat+'"]');
      var fileEl = document.querySelector('input[type=file][data-req="'+reqId+'"][data-cat="'+cat+'"]');
      msg.className='msg'; msg.textContent='';
      var f = fileEl && fileEl.files && fileEl.files[0];
      if(!f){ msg.className='msg err'; msg.textContent=' Choose a file first.'; return; }
      if(f.size > 15*1024*1024){ msg.className='msg err'; msg.textContent=' File exceeds 15 MB.'; return; }
      var reader = new FileReader();
      reader.onload = async function(){
        btn.disabled = true; msg.textContent=' Uploading…';
        try{
          var res = await fetch('/api/verification/requests/'+reqId+'/documents', {
            method:'POST', headers:{ 'Content-Type':'application/json', Authorization:'Bearer '+token },
            body: JSON.stringify({ category:cat, filename:f.name, content_type:f.type, data_base64:String(reader.result) })
          });
          var json = await res.json();
          if(res.ok && json.success){ msg.className='msg ok'; msg.textContent=' Uploaded. Status: '+json.data.status+'.'; btn.disabled=true; }
          else { msg.className='msg err'; msg.textContent=' '+(json.message||'Upload failed.'); btn.disabled=false; }
        }catch(e){ msg.className='msg err'; msg.textContent=' Network error.'; btn.disabled=false; }
      };
      reader.readAsDataURL(f);
    }
    load();
    loadBusiness();
  </script>
<script src="/widgets/shared/member-nav-config.js"></script>
<script src="/widgets/shared/member-chrome.js"></script>
<script src="/widgets/shared/seller-page-chrome.js"></script>
</body>
</html>
