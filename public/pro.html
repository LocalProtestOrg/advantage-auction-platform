<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<!-- Public professional profiles are served only when the owner has published; kept noindex until
     directory/SEO publication is enabled by the owner (structured data is emitted for that future). -->
<meta name="robots" content="noindex" />
<title>Professional Profile - Advantage.Bid</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#0B1B2B;--paper:#FBFAF7;--surface:#fff;--muted:#637488;--hair:#ECE8E0;--accent:#2F6BFF;--live:#B5273B;--ok:#16A34A}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  a{color:var(--accent);text-decoration:none}
  .serif{font-family:"Fraunces","Georgia",serif}
  .previewbar{background:#0f172a;color:#fff;font-size:13px;font-weight:600;padding:9px 16px;display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}
  .previewbar a{color:#a9c6ff;font-weight:800}
  .wrap{max-width:920px;margin:0 auto;padding:0 16px 60px}
  .cover{height:200px;border-radius:0 0 20px 20px;background:linear-gradient(120deg,#1e3a8a,#2F6BFF) center/cover no-repeat;margin:0 -16px}
  @media(min-width:940px){.cover{margin:0;border-radius:20px;margin-top:18px}}
  .head{display:flex;gap:18px;align-items:flex-end;margin-top:-46px;padding:0 4px}
  .logo{width:104px;height:104px;border-radius:20px;border:4px solid #fff;background:#eef2f7 center/cover no-repeat;box-shadow:0 8px 24px rgba(8,16,28,.18);flex:0 0 auto}
  .head .ht{flex:1;min-width:0;padding-bottom:6px}
  .cat{font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#40536a}
  h1.nm{font-family:"Fraunces","Georgia",serif;font-weight:700;font-size:clamp(24px,4vw,34px);margin:2px 0 3px;line-height:1.1}
  .vf{display:inline-block;font-size:12px;font-weight:800;color:#15803d;background:#dcfce7;border-radius:999px;padding:2px 10px;margin-left:8px;vertical-align:middle}
  .tag{font-size:15px;color:#334155}
  .loc{font-size:13.5px;color:var(--muted);margin-top:4px}
  .rate{color:#f59e0b;letter-spacing:2px;font-size:15px;margin-top:6px}.rate small{color:#94a3b8;font-size:12px;letter-spacing:0;margin-left:6px}
  .ctas{display:flex;gap:10px;flex-wrap:wrap;margin:18px 4px 0}
  .btn{border:0;border-radius:12px;padding:12px 18px;font-weight:800;font-size:14.5px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
  .btn.primary{background:var(--live);color:#fff}.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--hair)}
  .btn.ghost:hover{border-color:var(--accent);color:var(--accent)}
  .grid{display:grid;grid-template-columns:1fr 300px;gap:24px;margin-top:26px;align-items:start}
  @media(max-width:820px){.grid{grid-template-columns:1fr}}
  .card{background:var(--surface);border:1px solid var(--hair);border-radius:16px;padding:20px;margin-bottom:18px}
  .card h2{font-family:"Fraunces","Georgia",serif;font-weight:600;font-size:18px;margin:0 0 12px}
  .about{font-size:15px;line-height:1.6;color:#1f2937;white-space:pre-wrap}
  .items{display:flex;flex-direction:column;gap:12px}
  .item .l{font-size:12px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
  .item .v{font-size:14.5px;color:#1f2937}
  .tags{display:flex;flex-wrap:wrap;gap:6px}
  .tags .tg{font-size:12.5px;font-weight:700;color:#0f172a;background:#eef2f7;border-radius:999px;padding:4px 11px}
  .side .row{display:flex;gap:10px;align-items:center;font-size:14px;color:#1f2937;padding:8px 0;border-bottom:1px solid #f1f5f9}
  .side .row:last-child{border-bottom:0}.side .row .k{color:var(--muted);width:20px;text-align:center}
  .gal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .gal .g{aspect-ratio:4/3;border-radius:10px;background:#eef0f3 center/cover no-repeat;border:1px solid var(--hair)}
  .headshot{width:72px;height:72px;border-radius:14px;background:#eef2f7 center/cover no-repeat;border:1px solid var(--hair);float:right;margin:0 0 8px 12px}
  .social{display:flex;gap:8px;flex-wrap:wrap}
  .social a{font-size:13px;font-weight:700;background:#eef4ff;color:#1e3a8a;border:1px solid #d6e2ff;border-radius:999px;padding:6px 12px}
  .center{padding:80px 20px;text-align:center;color:var(--muted)}
  .center .big{font-family:"Fraunces","Georgia",serif;font-size:22px;color:var(--ink);margin-bottom:8px}
  .foot{text-align:center;color:#94a3b8;font-size:12.5px;margin-top:26px}
</style>
</head>
<body>
<div id="preview" style="display:none"></div>
<div class="wrap" id="wrap"><div class="center">Loading…</div></div>
<div id="jsonld"></div>
<script>
(function(){
  var params = new URLSearchParams(location.search);
  var slug = params.get('slug'); var isPreview = params.get('preview') === '1';
  var wrap = document.getElementById('wrap');
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function center(big,sub){wrap.innerHTML='<div class="center"><div class="big">'+esc(big)+'</div><p>'+esc(sub||'')+'</p></div>';}
  if(!slug){center('Profile not found','No profile was specified.');return;}

  if(isPreview){
    var token = localStorage.getItem('token');
    if(!token){ location.href='/login.html?next='+encodeURIComponent(location.pathname+location.search); return; }
    fetch('/api/org/profile',{headers:{Authorization:'Bearer '+token}}).then(function(r){return r.json();})
      .then(function(d){ if(d && d.success && d.preview){ document.getElementById('preview').style.display='block'; document.getElementById('preview').innerHTML='<div class="previewbar">Preview of your public profile'+(d.preview.published?'':' — not published yet (only you can see this)')+' &nbsp;·&nbsp; <a href="/org/profile.html">Edit Profile</a></div>'; render(d.preview, true); }
        else center('Nothing to preview yet','Create your profile first.'); })
      .catch(function(){ center('Could not load preview','Please try again.'); });
  } else {
    fetch('/api/public/professionals/'+encodeURIComponent(slug)).then(function(r){ if(r.status===404) throw new Error('404'); return r.json(); })
      .then(function(d){ if(d && d.success && d.profile) render(d.profile, false); else center('Profile not available',''); })
      .catch(function(e){ if(e.message==='404') center('Profile not public yet','This professional has not published their profile.'); else center('Could not load profile',''); });
  }

  function render(p, preview){
    var h=p.header||{}, c=p.contact||{};
    var stars='★★★★★';
    var editBtn = preview ? '<a class="btn ghost" href="/org/profile.html">✎ Edit Profile</a>' : '';
    var ctas='';
    if(c.phone) ctas+='<a class="btn primary" href="tel:'+esc(c.phone)+'">Call</a>';
    if(c.email) ctas+='<a class="btn ghost" href="mailto:'+esc(c.email)+'">Email</a>';
    if(c.website) ctas+='<a class="btn ghost" href="'+esc(c.website)+'" target="_blank" rel="noopener">Website</a>';
    ctas+=editBtn;

    var side='';
    if(c.phone) side+='<div class="row"><span class="k">📞</span><span>'+esc(c.phone)+'</span></div>';
    if(c.email) side+='<div class="row"><span class="k">✉</span><span>'+esc(c.email)+'</span></div>';
    if(c.website) side+='<div class="row"><span class="k">🔗</span><a href="'+esc(c.website)+'" target="_blank" rel="noopener">Website</a></div>';
    if(h.location) side+='<div class="row"><span class="k">📍</span><span>'+esc(h.location)+'</span></div>';

    var mainSecs=(p.sections||[]).map(function(s){
      return '<div class="card"><h2>'+esc(s.title)+'</h2><div class="items">'+s.items.map(function(it){
        var val = it.kind==='tags' ? '<div class="tags">'+(it.value||[]).map(function(v){return '<span class="tg">'+esc(v)+'</span>';}).join('')+'</div>' : esc(it.value);
        return '<div class="item"><div class="l">'+esc(it.label)+'</div><div class="v">'+val+'</div></div>';
      }).join('')+'</div></div>';
    }).join('');

    var about = p.about ? '<div class="card">'+(h.headshot?'<div class="headshot" style="background-image:url(\''+esc(h.headshot)+'\')"></div>':'')+'<h2>About</h2><div class="about">'+esc(p.about)+'</div></div>' : '';
    var gallery = (p.gallery&&p.gallery.length) ? '<div class="card"><h2>Photos</h2><div class="gal">'+p.gallery.map(function(u){return '<div class="g" style="background-image:url(\''+esc(u)+'\')"></div>';}).join('')+'</div></div>' : '';
    var social = (p.social&&p.social.length) ? '<div class="card"><h2>Connect</h2><div class="social">'+p.social.map(function(s){return '<a href="'+esc(s.url)+'" target="_blank" rel="noopener">'+esc(s.network)+'</a>';}).join('')+'</div></div>' : '';

    wrap.innerHTML=
      '<div class="cover" style="'+(h.cover?'background-image:url(\''+esc(h.cover)+'\')':'')+'"></div>'
      +'<div class="head"><div class="logo" style="'+(h.logo?'background-image:url(\''+esc(h.logo)+'\')':'')+'"></div>'
      +'<div class="ht"><div class="cat">'+esc(h.category||'Professional')+'</div>'
      +'<h1 class="nm">'+esc(h.name||'')+(h.verified?'<span class="vf">Verified</span>':'')+'</h1>'
      +(h.tagline?'<div class="tag">'+esc(h.tagline)+'</div>':'')
      +(h.location?'<div class="loc">📍 '+esc(h.location)+'</div>':'')
      +'<div class="rate">'+stars+'<small>New profile</small></div></div></div>'
      +'<div class="ctas">'+ctas+'</div>'
      +'<div class="grid"><div class="main">'
      +(h.short_description?'<div class="card"><div class="about">'+esc(h.short_description)+'</div></div>':'')
      +about+mainSecs+gallery+social+'</div>'
      +'<aside class="side"><div class="card"><h2>Contact</h2>'+(side||'<div class="v" style="color:#94a3b8">No contact details yet</div>')+'</div></aside></div>'
      +'<div class="foot">Powered by Advantage.Bid</div>';

    // JSON-LD structured data (real data only)
    try{
      var ld={"@context":"https://schema.org","@type":"LocalBusiness",name:h.name,description:(p.seo&&p.seo.description)||h.short_description||undefined,
        image:h.logo||h.cover||undefined,telephone:c.phone||undefined,url:c.website||undefined,
        address:h.location?{"@type":"PostalAddress",addressLocality:h.location}:undefined};
      Object.keys(ld).forEach(function(k){if(ld[k]===undefined)delete ld[k];});
      var s=document.createElement('script');s.type='application/ld+json';s.textContent=JSON.stringify(ld);document.getElementById('jsonld').appendChild(s);
    }catch(e){}
    document.title=(h.name||'Professional Profile')+' - Advantage.Bid';
  }
})();
</script>
</body>
</html>
